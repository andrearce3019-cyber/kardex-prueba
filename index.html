<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kardex de la Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera con pestañas en computadora; en celular, barra de navegación fija abajo y una sola columna. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#172131; --muted:#5B6779; --line:#DCE1E8; --soft:#EEF1F5;
  --accent:#2347C5; --accent-weak:#E6EBFB; --on-accent:#FFFFFF;
  --ok:#1B7A48; --ok-weak:#E3F3EA; --warn:#9A5B00; --warn-weak:#FBF0DC; --bad:#BF2D27; --bad-weak:#FBE6E4;
  --bonus:#7140B0; --bonus-weak:#F0E8FA; --wa:#1E8E4E;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#97A2B2; --line:#283241; --soft:#1C2430;
  --accent:#7F9CFF; --accent-weak:#1D2A4F; --on-accent:#0E131A;
  --ok:#4FC587; --ok-weak:#15301F; --warn:#E6A33C; --warn-weak:#33260F; --bad:#FF6E66; --bad-weak:#3A1A18;
  --bonus:#BC8EF2; --bonus-weak:#2A1D3D; --wa:#4FC587; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#97A2B2; --line:#283241; --soft:#1C2430;
  --accent:#7F9CFF; --accent-weak:#1D2A4F; --on-accent:#0E131A;
  --ok:#4FC587; --ok-weak:#15301F; --warn:#E6A33C; --warn-weak:#33260F; --bad:#FF6E66; --bad-weak:#3A1A18;
  --bonus:#BC8EF2; --bonus-weak:#2A1D3D; --wa:#4FC587; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
img{max-width:100%}[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.72rem;font-weight:400;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.live.off i{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs button{all:unset;cursor:pointer;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
nav.bottom{display:none}
@media (max-width:720px){
  nav.tabs{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  nav.bottom button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 0}
  nav.bottom button svg{width:22px;height:22px}
  nav.bottom button[aria-current="true"]{color:var(--accent)}
  main{padding-bottom:96px!important}
}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:20px 64px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem}h2{font-size:1.12rem}h3{font-size:1rem}
.sub{color:var(--muted);margin:2px 0 0}
.mono{font-family:var(--f-mono);font-size:.85em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 200px;min-width:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:9px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;min-height:42px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem;min-height:32px}
.btn.big{padding:14px 18px;font-size:1.02rem;width:100%}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--accent)}
.kpi .lab{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .note{font-size:.82rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.bajo,.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.quiebre,.pill.agotado,.pill.bad{background:var(--bad-weak);color:var(--bad)}
.pill.sindatos,.pill.gris{background:var(--soft);color:var(--muted)}
.pill.bonus{background:var(--bonus-weak);color:var(--bonus)}
.pill.tag{background:var(--accent-weak);color:var(--accent)}
.alerta{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--soft)}
.alerta .dot{width:10px;height:10px;border-radius:50%}
.alerta.bad .dot{background:var(--bad)}.alerta.warn .dot{background:var(--warn)}.alerta.info .dot{background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters>*{flex:1 1 150px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;min-height:42px}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type="checkbox"]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--bonus)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
.empty p{max-width:46ch;margin:0;color:var(--muted)}
.banner{padding:10px 14px;border-radius:9px;background:var(--warn-weak);color:var(--warn);font-size:.9rem}
.banner.info{background:var(--accent-weak);color:var(--accent)}
.banner.bad{background:var(--bad-weak);color:var(--bad)}
.banner.ok{background:var(--ok-weak);color:var(--ok)}
/* Vender */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;align-content:start}
.tile:hover,.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .n{font-weight:600;line-height:1.25}
.tile .s{font-size:.82rem;color:var(--muted)}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;align-items:center}
.stepper input{text-align:center;font-size:1.3rem;font-weight:700}
.stepper .btn{font-size:1.4rem;min-height:52px}
/* Recibir */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;justify-items:center;text-align:center;background:var(--soft)}
.drop img{max-height:200px;border-radius:8px;border:1px solid var(--line)}
.grupo{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.grupo.dup{border-color:var(--warn)}.grupo.falta{border-color:var(--bad)}
.linea{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr)) minmax(120px,1.4fr) auto auto;gap:8px;align-items:end;padding-top:10px;border-top:1px dashed var(--line)}
.linea .desc{grid-column:1/-1;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.linea .bon{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--bonus);padding-bottom:10px}
@media (max-width:720px){.linea{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cuadre{font-weight:600;padding:10px 12px;border-radius:9px}
.cuadre.ok{background:var(--ok-weak);color:var(--ok)}.cuadre.bad{background:var(--warn-weak);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
/* Ficha */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.stat .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .val{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat .note{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.login{max-width:420px;margin:12vh auto 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Kardex <span class="live" id="live"><i></i><span>conectando…</span></span></div>
      <button class="btn primary sm" data-go="vender" id="btnVenderTop">Vender</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav class="bottom" id="bottom"></nav>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>

<script>
// ---------- Conexión ----------
const SB_URL = "https://rvxmmmwrzmoukyxfkeuv.supabase.co";
const SB_KEY = "sb_publishable_RHD0zK0Q_uiXXQZnt6XSLA_3QXkEBhy"; // clave pública: los datos los protege la clave de la tienda
const LS = {get(k){ try{ return localStorage.getItem(k); }catch{ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch{} }, del(k){ try{ localStorage.removeItem(k); }catch{} }};

// ---------- Configuración del negocio ----------
const DIAS_QUIEBRE = 3, DIAS_BAJO = 7, DIAS_PEDIDO = 15, DIAS_AVISO_CREDITO = 3;
const LINEAS = ["Limpieza","Cuidado personal","Descartables","Plásticos y hogar","Abarrotes","Bebidas","Otros"];
const UNIDADES = ["unidad","paquete","tira","pack","caja","docena","ciento","bolsa","rollo","botella","galón","kilo"];
const PLURAL = {unidad:"unidades",paquete:"paquetes",tira:"tiras",pack:"packs",caja:"cajas",docena:"docenas",ciento:"cientos",bolsa:"bolsas",rollo:"rollos",botella:"botellas","galón":"galones",kilo:"kilos"};
const OBS = [["","Llegó bien"],["faltó","Faltó"],["dañado","Llegó dañado"],["cambio","Lo cambiaron"],["descuento","Descuento"]];

// ---------- Estado ----------
const S = {
  clave: LS.get("kardex-clave"), conectado: false, cargando: false,
  productos: [], proveedores: [], pedidos: [], pitems: [], recepciones: [], ritems: [], ventas: [], stock: new Map(),
  view: (location.hash || "#inicio").slice(1), f: {q:"", linea:"", marca:"", prov:""},
  venta: {q:"", sel:null, cant:1, precio:""}, pedido: null, rec: null, abierto: null
};
const VIEWS = ["inicio","vender","pedidos","recibir","inventario","creditos","proveedores","mas"];
if(!VIEWS.includes(S.view)) S.view = "inicio";

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const soles = n => "S/ " + (Number(n)||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = (n,d=1) => (Number(n)||0).toLocaleString("es-PE",{maximumFractionDigits:d});
const toNum = v => { const n = parseFloat(String(v ?? "").replace(",",".")); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,"0");
const fISO = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoy = () => fISO(new Date());
const sumarDias = (f,n) => { const d = new Date(f+"T12:00:00"); d.setDate(d.getDate()+n); return fISO(d); };
const diasEntre = (a,b) => Math.round((Date.parse(b+"T12:00:00")-Date.parse(a+"T12:00:00"))/86400000);
const diaLocal = ts => fISO(new Date(ts));
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fecha = f => { if(!f) return "—"; const [y,m,d] = f.slice(0,10).split("-"); return `${+d} ${MESES[m-1]}${y !== hoy().slice(0,4) ? " "+y : ""}`; };
const fechaLarga = f => { const d = new Date(f+"T12:00:00"); return DIAS[d.getDay()]+" "+fecha(f); };
const hora = ts => { const d = new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const norm = s => String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9]+/g," ").trim();
const plural = (u,n) => n === 1 ? u : (PLURAL[u] || u);
const uv = p => p?.unidad_venta || "unidad";
const prod = id => S.productos.find(p => p.id === id);
const prov = id => S.proveedores.find(p => p.id === id);

function toast(msg){
  const r = $("#toastRoot"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 3200);
}
function palabras(s){ return new Set(norm(s).split(" ").filter(w => w.length > 2 && !/^\d+$/.test(w))); }
function parecido(a,b){ const A = palabras(a), B = palabras(b); if(!A.size || !B.size) return 0; let c = 0; A.forEach(w => { if(B.has(w)) c++; }); return c/Math.min(A.size,B.size); }
const parecidos = (nombre, excluir) => S.productos.filter(p => p.id !== excluir && parecido(nombre, p.nombre) >= 0.75);
const porNombre = nombre => S.productos.find(p => norm(p.nombre) === norm(nombre));
const porAlias = desc => { const n = norm(desc); return S.productos.find(p => (p.alias||[]).includes(n) || norm(p.nombre) === n); };

// ---------- API ----------
async function api(path, {method = "GET", body, prefer} = {}){
  const h = {apikey: SB_KEY, "Content-Type": "application/json", "x-clave-tienda": S.clave || ""};
  if(prefer) h.Prefer = prefer;
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {method, headers: h, body: body === undefined ? undefined : JSON.stringify(body)});
  if(!r.ok){ let m = ""; try{ m = (await r.json()).message; }catch{} const e = new Error(m || ("HTTP "+r.status)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const insertar = (tabla, filas) => api(tabla, {method:"POST", body: filas, prefer:"return=representation"});
const actualizar = (tabla, id, cambios) => api(`${tabla}?id=eq.${id}`, {method:"PATCH", body: cambios, prefer:"return=representation"});
const borrar = (tabla, id) => api(`${tabla}?id=eq.${id}`, {method:"DELETE"});

async function cargar(){
  if(S.cargando || !S.clave) return; S.cargando = true;
  try{
    const desde = new Date(Date.now() - 31*86400000).toISOString();
    const [productos, proveedores, pedidos, pitems, recepciones, ritems, ventas, stock] = await Promise.all([
      api("productos?select=*&order=nombre"), api("proveedores?select=*&order=nombre"),
      api("pedidos?select=*&order=creado.desc&limit=300"), api("pedido_items?select=*"),
      api("recepciones?select=*&order=fecha.desc&limit=500"), api("recepcion_items?select=*"),
      api(`ventas?select=*&creado=gte.${desde}&order=creado.desc`), api("stock_productos?select=*")
    ]);
    Object.assign(S, {productos, proveedores, pedidos, pitems, recepciones, ritems, ventas, conectado:true});
    S.stock = new Map(stock.map(s => [s.producto_id, toNum(s.recibido) - toNum(s.vendido) + toNum(s.ajustado)]));
    marcarVivo(true);
  }catch(e){ marcarVivo(false); if(e.status === 401 || e.status === 403) salir(); }
  finally{ S.cargando = false; }
}
function marcarVivo(ok){ const l = $("#live"); l.classList.toggle("off", !ok); l.lastElementChild.textContent = ok ? "en vivo · "+hora(Date.now()) : "sin conexión"; }
const editando = () => ["vender","pedidos","recibir"].includes(S.view) && (S.pedido || S.rec || document.activeElement?.matches?.("input,select,textarea"));
async function refrescar(forzar){ await cargar(); if(forzar || !editando()) render(); if(S.abierto && !document.activeElement?.closest?.(".sheet")) renderFicha(); }

// ---------- Cálculos ----------
function calc(p){
  const stock = S.stock.get(p.id) ?? 0;
  const its = S.ritems.filter(i => i.producto_id === p.id);
  let uni = 0, gasto = 0, bon = 0;
  its.forEach(i => { uni += toNum(i.unidades); gasto += toNum(i.importe); if(i.bonificacion) bon += toNum(i.unidades); });
  const costo = uni > 0 ? gasto/uni : null;
  const vs = S.ventas.filter(v => v.producto_id === p.id);
  const vendidoHoy = vs.filter(v => diaLocal(v.creado) === hoy()).reduce((a,v) => a+toNum(v.cantidad), 0);
  const vendido30 = vs.reduce((a,v) => a+toNum(v.cantidad), 0);
  const primera = vs.length ? diaLocal(vs[vs.length-1].creado) : null;
  const dias = primera ? Math.max(1, Math.min(30, diasEntre(primera, hoy()) + 1)) : 0;
  const consumo = primera ? vendido30/dias : null;
  const cobertura = consumo > 0 ? stock/consumo : null;
  let estado = "ok";
  if(stock <= 0) estado = "agotado";
  else if((toNum(p.stock_minimo) > 0 && stock <= toNum(p.stock_minimo)) || (cobertura !== null && cobertura <= DIAS_QUIEBRE)) estado = "quiebre";
  else if(cobertura !== null && cobertura <= DIAS_BAJO) estado = "bajo";
  else if(consumo === null && !(toNum(p.stock_minimo) > 0)) estado = "sindatos";
  let sugerido = null;
  if(consumo > 0){ const falta = consumo*DIAS_PEDIDO - stock; if(falta > 0){
    const big = Object.entries(p.presentaciones||{}).filter(([,f]) => f > 1).sort((a,b) => b[1]-a[1])[0];
    sugerido = big ? {cant:Math.ceil(falta/big[1]), unidad:big[0]} : {cant:Math.ceil(falta), unidad:uv(p)}; } }
  const provs = new Set(its.map(i => S.recepciones.find(r => r.id === i.recepcion_id)?.proveedor_id).filter(Boolean));
  return {stock, costo, bon, vendidoHoy, consumo, cobertura, estado, sugerido, provs, valor: costo !== null ? Math.max(0,stock)*costo : 0};
}
const ESTADO = {agotado:"Agotado", quiebre:"Por agotarse", bajo:"Stock bajo", ok:"Bien", sindatos:"Sin ventas aún"};
const ORDEN = {agotado:0, quiebre:1, bajo:2, sindatos:3, ok:4};
const pill = e => `<span class="pill ${e}">${ESTADO[e]}</span>`;
const cobTxt = c => c.cobertura === null ? "—" : c.cobertura > 365 ? "+1 año" : num(c.cobertura, c.cobertura < 10 ? 1 : 0)+" días";

function estadoCredito(r){
  if(r.condicion !== "credito" || r.pagado) return null;
  const d = diasEntre(hoy(), r.vence || r.fecha);
  return d < 0 ? {cls:"bad", txt:`Venció hace ${-d} día${d===-1?"":"s"}`, d} : d === 0 ? {cls:"bad", txt:"Vence hoy", d} : d <= DIAS_AVISO_CREDITO ? {cls:"warn", txt:`Vence en ${d} día${d===1?"":"s"}`, d} : {cls:"gris", txt:`Vence ${fecha(r.vence)}`, d};
}
function avancePedido(pe){
  const items = S.pitems.filter(i => i.pedido_id === pe.id);
  const recs = new Set(S.recepciones.filter(r => r.pedido_id === pe.id).map(r => r.id));
  const recibido = {}; S.ritems.filter(i => recs.has(i.recepcion_id)).forEach(i => recibido[i.producto_id] = (recibido[i.producto_id]||0) + toNum(i.unidades));
  let pedidas = 0, llegaron = 0;
  const lineas = items.map(i => { const u = toNum(i.cantidad)*toNum(i.factor); const r = Math.min(u, recibido[i.producto_id]||0); pedidas += u; llegaron += r; return {...i, unidadesPedidas:u, unidadesRecibidas:recibido[i.producto_id]||0, pendiente:Math.max(0,u-(recibido[i.producto_id]||0))}; });
  return {lineas, pct: pedidas ? llegaron/pedidas : 0, recepciones: recs.size};
}

function mensajeResumen(){
  const C = new Map(S.productos.map(p => [p.id, calc(p)]));

  const L = [`*Kardex · ${fechaLarga(hoy())}*`, `Vendido hoy: ${soles(ventasHoy.reduce((a,v) => a+toNum(v.total),0))} (${ventasHoy.length} ventas)`];

  const creds = S.recepciones.map(r => ({r, e:estadoCredito(r)})).filter(x => x.e && x.e.d <= DIAS_AVISO_CREDITO);
  if(creds.length){ L.push("", "*Créditos por pagar:*"); creds.forEach(({r,e}) => L.push(`• ${prov(r.proveedor_id)?.nombre || "Proveedor"} ${soles(r.total)} – ${e.txt}`)); }

}

  const recibidas = g.lineas.reduce((a,l) => a+toNum(l.cantidad)*toNum(l.factor), 0);
  const falta = g.pedidoUnidades ? Math.max(0, g.pedidoUnidades - recibidas) : 0;
  return `<div class="grupo ${dup.length ? "dup" : ""} ${falta ? "falta" : ""}">
    <div class="row between">
      <label class="f grow">Producto<select data-g="${gi}" data-gf="productoId"><option value="">＋ Producto nuevo</option>${S.productos.map(o => `<option value="${o.id}" ${o.id===g.productoId?"selected":""}>${esc(o.nombre)}</option>`).join("")}</select></label>
      ${g.pedidoUnidades ? `<span class="pill ${falta ? "bad" : "ok"}">Pedido ${num(g.pedidoUnidades,1)} · ${falta ? "faltan "+num(falta,1) : "completo"}</span>` : p ? `<span class="pill tag">Se suma al stock</span>` : `<span class="pill warn">Nuevo</span>`}
    </div>
    ${!p ? `<div class="grid2">
      <label class="f">Nombre<input data-g="${gi}" data-nf="nombre" value="${esc(g.nuevo.nombre)}"></label>
      <label class="f">Marca<input data-g="${gi}" data-nf="marca" value="${esc(g.nuevo.marca)}"></label>
      <label class="f">Línea<input data-g="${gi}" data-nf="linea" value="${esc(g.nuevo.linea)}" list="dlLinea"></label>
      <label class="f">Lo vendo por<select data-g="${gi}" data-nf="unidadVenta">${UNIDADES.map(x => `<option ${x===g.nuevo.unidadVenta?"selected":""}>${x}</option>`).join("")}</select></label>
    </div>` : ""}

      ${l.descripcion ? `<div class="desc">${esc(l.descripcion)}</div>` : ""}
      <label class="f">Llegó<input data-g="${gi}" data-l="${li}" data-lf="cantidad" inputmode="decimal" value="${esc(l.cantidad)}"></label>
      <label class="f">Unidad<input data-g="${gi}" data-l="${li}" data-lf="unidadCompra" value="${esc(l.unidadCompra)}"></label>
      <label class="f">Trae<input data-g="${gi}" data-l="${li}" data-lf="factor" inputmode="decimal" value="${esc(l.factor)}"></label>
      <label class="f">Importe S/<input data-g="${gi}" data-l="${li}" data-lf="importe" inputmode="decimal" value="${esc(l.importe)}"></label>
      <label class="f">¿Cómo llegó?<select data-g="${gi}" data-l="${li}" data-lf="observacion">${OBS.map(([v,t]) => `<option value="${v}" ${v===(l.observacion||"")?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="bon"><input type="checkbox" data-g="${gi}" data-l="${li}" data-lf="bonificacion" ${l.bonificacion?"checked":""}> Bonif.</label>
      <button class="btn sm" data-act="del-linea" data-g="${gi}" data-l="${li}" aria-label="Quitar línea">✕</button>
    </div>`).join("")}
    <div class="row between"><span class="small muted" id="u-${gi}">Entran ${num(recibidas,2)} ${esc(plural(u,recibidas))}</span><button class="btn sm" data-act="add-linea" data-g="${gi}">+ Otra línea</button></div>
  </div>`;
}
function cuadreHtml(){
  const d = S.rec; if(!d) return "";
  const suma = d.grupos.reduce((a,g) => a+g.lineas.reduce((b,l) => b+toNum(l.importe),0), 0);
  const total = toNum(d.total);
  if(!total) return `<div class="cuadre bad">Los importes suman ${soles(suma)}. Escribe el total de la boleta para comprobarlo.</div>`;
  const dif = Math.round((suma-total)*100)/100;
  return dif === 0 ? `<div class="cuadre ok">✓ Cuadra: los importes suman ${soles(suma)}, igual que el total de la boleta.</div>`
    : `<div class="cuadre bad">Los importes suman ${soles(suma)} y la boleta dice ${soles(total)} (diferencia ${soles(dif)}). Revisa cantidades e importes.</div>`;
}
const lineaVacia = () => ({descripcion:"", cantidad:1, unidadCompra:"UN", factor:1, precioUnit:0, importe:0, bonificacion:false, observacion:""});
const grupoVacio = () => ({productoId:"", nuevo:{nombre:"", marca:"", linea:"", categoria:"", unidadVenta:"unidad"}, lineas:[lineaVacia()], pedidoUnidades:0});
function nuevaRecepcion(pedidoId){
  const pe = S.pedidos.find(p => p.id === pedidoId);
  const pr = pe ? prov(pe.proveedor_id) : null;
  const d = {pedidoId: pe?.id || null, proveedor: pr?.nombre || "", fecha: hoy(), documento:"", total:0,
    condicion: pr?.dias_credito ? "credito" : "contado", dias: pr?.dias_credito || 15, file:null, url:null, leyendo:false, leida:false, error:"", dudas:[], grupos:[]};
  if(pe){
    avancePedido(pe).lineas.filter(l => l.pendiente > 0).forEach(l => {
      const cant = l.pendiente / toNum(l.factor || 1);
      d.grupos.push({productoId:l.producto_id, nuevo:grupoVacio().nuevo, pedidoUnidades:l.pendiente,
        lineas:[{descripcion:"", cantidad:Math.round(cant*100)/100, unidadCompra:l.unidad_compra, factor:toNum(l.factor), precioUnit:toNum(l.precio_unit), importe:Math.round(cant*toNum(l.precio_unit)*100)/100, bonificacion:false, observacion:""}]});
    });
  }
  if(!d.grupos.length) d.grupos.push(grupoVacio());
  S.rec = d; ir("recibir");
}

// Fotos: la boleta completa y dos acercamientos para leer mejor la letra matricial
function cargarImagen(file){ return new Promise((ok, mal) => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => ok({im, url: fr.result}); im.onerror = mal; im.src = fr.result; }; fr.onerror = mal; fr.readAsDataURL(file); }); }
function recorte(im, y0, y1, lado = 1600){
  const sw = im.naturalWidth, sh = Math.round(im.naturalHeight*(y1-y0)), sy = Math.round(im.naturalHeight*y0);
  const k = Math.min(1, lado/Math.max(sw, sh)); const c = document.createElement("canvas");
  c.width = Math.round(sw*k); c.height = Math.round(sh*k);
  c.getContext("2d").drawImage(im, 0, sy, sw, sh, 0, 0, c.width, c.height);
  return {media_type:"image/jpeg", data: c.toDataURL("image/jpeg", 0.88).split(",")[1]};
}
async function leerBoleta(){
  const d = S.rec; if(!d?.img) return;
  d.leyendo = true; d.error = ""; render();
  try{
    const imagenes = [recorte(d.img,0,1), recorte(d.img,0,0.58), recorte(d.img,0.42,1)];
    const productos = S.productos.map(p => ({id:p.id, nombre:p.nombre, marca:p.marca, unidadVenta:p.unidad_venta, presentaciones:p.presentaciones, alias:(p.alias||[]).slice(0,6)}));
    const r = await fetch(`${SB_URL}/functions/v1/leer-boleta`, {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json", "x-clave-tienda":S.clave}, body: JSON.stringify({imagenes, productos})});
    const res = await r.json().catch(() => ({error:"conexion"}));
    if(!r.ok || res.error) throw res;
    aplicarLectura(res);
    d.leida = true;
    toast(`Leí ${res.items?.length || 0} líneas${res.revisada ? " (revisadas dos veces)" : ""}. Revisa y guarda.`);
    setTimeout(() => $("#paso2")?.scrollIntoView({behavior:"smooth"}), 60);
  }catch(e){
    d.error = ({
      falta_api_key:"La lectura de fotos aún no está activada: falta poner la clave de API de Anthropic en Supabase. Mientras tanto, llena los productos a mano.",
      api_key_invalida:"La clave de API de Anthropic no es válida o no tiene saldo. Revísala en Supabase.",
      ocupado:"El servicio está ocupado. Espera un minuto e intenta otra vez.",
      no_json:"No pude entender la boleta. Toma la foto más de cerca, derecha y con más luz.",
      rechazada:"No se pudo procesar esta imagen. Prueba con otra foto.",
      clave:"La clave de la tienda no es válida. Vuelve a entrar."
    })[e?.error] || "No se pudo leer la boleta por un problema de conexión. Intenta de nuevo.";
  }finally{ d.leyendo = false; render(); }
}
function aplicarLectura(r){
  const d = S.rec;
  if(r.proveedor && !d.pedidoId) d.proveedor = (S.proveedores.find(p => parecido(p.nombre, r.proveedor) >= 0.6)?.nombre) || r.proveedor;
  d.ruc = r.ruc || "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(r.fecha || "")) d.fecha = r.fecha;
  d.documento = r.documento || d.documento; d.total = toNum(r.total) || d.total;
  if(r.condicion === "credito"){ d.condicion = "credito"; if(toNum(r.dias_credito) > 0) d.dias = toNum(r.dias_credito); }
  else if(r.condicion === "contado") d.condicion = "contado";
  d.dudas = Array.isArray(r.dudas) ? r.dudas.slice(0,5) : [];
  // Del pedido quedan los grupos; la boleta reemplaza sus líneas y agrega lo que no se pidió
  const base = d.grupos.filter(g => g.pedidoUnidades);
  base.forEach(g => g.lineas = []);
  const porClave = new Map(); base.forEach(g => porClave.set("p:"+g.productoId, g));
  const nuevos = [];
  for(const it of (r.items || [])){
    const desc = String(it.descripcion || "").trim();
    const ex = S.productos.find(p => p.id === it.productoKey) || porAlias(desc);
    const clave = ex ? "p:"+ex.id : "k:"+(it.productoKey || norm(desc)), cd = "d:"+norm(desc);
    let g = porClave.get(clave) || porClave.get(cd);
    if(!g){ const nv = it.nuevo || {};
      g = {productoId: ex?.id || "", pedidoUnidades:0, lineas:[], nuevo:{nombre: nv.nombre || desc, marca: nv.marca || "", linea: nv.linea || "", categoria: nv.categoria || "", unidadVenta: UNIDADES.includes(nv.unidadVenta) ? nv.unidadVenta : "unidad"}};
      nuevos.push(g); }
    porClave.set(clave, g); porClave.set(cd, g);
    const uc = String(it.unidadCompra || "UN").toUpperCase().trim();
    const factor = (ex?.presentaciones?.[uc]) || toNum(it.factor) || 1, importe = toNum(it.importe);
    g.lineas.push({descripcion:desc, cantidad: toNum(it.cantidad) || 1, unidadCompra:uc, factor, precioUnit: toNum(it.precioUnit), importe, bonificacion: !!it.bonificacion || importe === 0, observacion:""});
  }
  base.forEach(g => { if(!g.lineas.length){ const l = lineaVacia(); l.cantidad = 0; l.importe = 0; l.observacion = "faltó"; g.lineas.push(l); } });
  d.grupos = [...base, ...nuevos];
  if(!d.grupos.length) d.grupos.push(grupoVacio());
}

async function guardarRecepcion(btn){
  const d = S.rec;
  if(!d.proveedor.trim()){ toast("Escribe el proveedor."); return; }
  for(const g of d.grupos){
    if(!g.productoId && !g.nuevo.nombre.trim()){ toast("Falta el nombre de un producto nuevo."); return; }
    for(const l of g.lineas) if(toNum(l.cantidad) < 0 || !(toNum(l.factor) > 0)){ toast("Revisa cantidades y el campo Trae."); return; }
  }
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Guardando…`;
  try{
    let pr = S.proveedores.find(p => norm(p.nombre) === norm(d.proveedor));
    if(!pr) [pr] = await insertar("proveedores", {nombre:d.proveedor.trim(), ruc:d.ruc || null, dias_credito: d.condicion === "credito" ? toNum(d.dias) : 0});
    else if(d.condicion === "credito" && toNum(d.dias) && toNum(d.dias) !== pr.dias_credito) await actualizar("proveedores", pr.id, {dias_credito: toNum(d.dias)});
    const nuevos = new Map(), items = [];
    for(const g of d.grupos){
      const pres = {}, alias = new Set();
      g.lineas.forEach(l => { pres[String(l.unidadCompra||"UN").toUpperCase().trim()] = toNum(l.factor); if(l.descripcion) alias.add(norm(l.descripcion)); });
      let id = g.productoId;
      if(!id){
        const n = norm(g.nuevo.nombre), ya = porNombre(g.nuevo.nombre);
        if(ya) id = ya.id; else if(nuevos.has(n)) id = nuevos.get(n);
        else { const [p] = await insertar("productos", {nombre:g.nuevo.nombre.trim(), marca:g.nuevo.marca.trim() || null, linea:g.nuevo.linea.trim() || null, categoria:g.nuevo.categoria?.trim() || null, unidad_venta:g.nuevo.unidadVenta, presentaciones:pres, alias:[...alias]}); id = p.id; nuevos.set(n, id); }
      }
      if(!nuevos.has(norm(g.nuevo.nombre)) || g.productoId){ const p = prod(id); if(p) await actualizar("productos", id, {presentaciones:{...(p.presentaciones||{}), ...pres}, alias:[...new Set([...(p.alias||[]), ...alias])]}); }
      g.lineas.forEach(l => { const c = toNum(l.cantidad); if(c > 0 || l.observacion) items.push({producto_id:id, descripcion:l.descripcion || null, cantidad:c, unidad_compra:String(l.unidadCompra||"UN").toUpperCase().trim(), factor:toNum(l.factor), unidades:c*toNum(l.factor), precio_unit: toNum(l.precioUnit) || (c ? toNum(l.importe)/c : 0), importe:toNum(l.importe), bonificacion:!!l.bonificacion, observacion:l.observacion || null}); });
    }
    const total = toNum(d.total) || items.reduce((a,i) => a+i.importe, 0);
    const [rec] = await insertar("recepciones", {pedido_id:d.pedidoId, proveedor_id:pr.id, fecha:d.fecha || hoy(), documento:d.documento.trim() || null, total, condicion:d.condicion, dias_credito: d.condicion === "credito" ? toNum(d.dias) : null, vence: d.condicion === "credito" ? sumarDias(d.fecha || hoy(), toNum(d.dias)) : null, origen: d.leida ? "foto" : "manual"});
    if(items.length) await insertar("recepcion_items", items.map(i => ({...i, recepcion_id:rec.id})));
    if(d.pedidoId){ await cargar(); const pe = S.pedidos.find(p => p.id === d.pedidoId); if(pe){ const a = avancePedido(pe); await actualizar("pedidos", pe.id, {estado: a.lineas.every(l => l.pendiente <= 0) ? "recibido" : "parcial"}); } }
    S.rec = null; await refrescar(true); ir("inicio");
    toast(`Mercadería guardada: ${items.length} línea${items.length===1?"":"s"}.${d.condicion==="credito" ? " Crédito anotado." : ""}`);
  }catch(e){ btn.disabled = false; btn.textContent = "Guardar en el inventario"; toast("No se pudo guardar: " + (e.message || "revisa tu conexión")); }
}

function vistaInventario(){
  const C = new Map(S.productos.map(p => [p.id, calc(p)]));
  const valor = [...C.values()].reduce((a,c) => a+c.valor, 0);
  return `<div><h1>Inventario general</h1><p class="sub">${S.productos.length} productos · ${soles(valor)} a costo real</p></div>
  <section class="card"><div class="tbl"><table><thead><tr><th>Producto</th><th>Línea</th><th class="r">Stock</th><th class="r">Costo c/u</th><th class="r">Valor</th><th>Estado</th></tr></thead><tbody>
    ${S.productos.map(p => { const c = C.get(p.id); return `<tr class="click" data-act="abrir" data-id="${p.id}"><td><b>${esc(p.nombre)}</b><br><span class="small muted">${esc(p.marca || "")}</span></td><td>${esc(p.linea || "—")}</td><td class="r">${num(c.stock,1)} <span class="small muted">${esc(plural(uv(p),c.stock))}</span></td><td class="r">${c.costo !== null ? soles(c.costo) : "—"}</td><td class="r">${soles(c.valor)}</td><td>${pill(c.estado)}</td></tr>`; }).join("") || `<tr><td colspan="6" class="muted">Aún no hay productos.</td></tr>`}
  </tbody></table></div></section>`;
}
function renderFicha(){
  const p = prod(S.abierto); if(!p){ cerrarFicha(); return; }
  const c = calc(p);
  const hist = S.ritems.filter(i => i.producto_id === p.id).map(i => ({...i, r:S.recepciones.find(r => r.id === i.recepcion_id)})).filter(x => x.r).sort((a,b) => b.r.fecha.localeCompare(a.r.fecha));
  $("#overlayRoot").innerHTML = `<div class="overlay" data-act="cerrar-fondo"><div class="sheet" role="dialog" aria-label="${esc(p.nombre)}">
    <div class="row between" style="align-items:flex-start"><div style="min-width:0"><h1 style="font-size:1.3rem">${esc(p.nombre)}</h1><p class="sub">${esc([p.marca,p.linea,p.categoria].filter(Boolean).join(" · ") || "Sin clasificar")} · se vende por ${esc(uv(p))}</p></div><button class="btn sm" data-act="cerrar">Cerrar</button></div>
    <div class="row">${pill(c.estado)}${c.sugerido ? `<span class="pill tag">Pedir ${c.sugerido.cant} ${esc(c.sugerido.unidad.toLowerCase())}</span>` : ""}</div>
    <div class="stats">
      <div class="stat"><div class="lab">Stock ahora</div><div class="val">${num(c.stock,2)}</div><div class="note">${esc(plural(uv(p),c.stock))}</div></div>
      <div class="stat"><div class="lab">Vendido hoy</div><div class="val">${num(c.vendidoHoy,2)}</div><div class="note">${c.consumo !== null ? "promedio "+num(c.consumo,1)+"/día" : "sin ventas aún"}</div></div>
      <div class="stat"><div class="lab">Alcanza para</div><div class="val">${cobTxt(c)}</div><div class="note">${c.cobertura !== null ? "hasta el "+fecha(sumarDias(hoy(), Math.floor(c.cobertura))) : ""}</div></div>
      <div class="stat"><div class="lab">Costo real</div><div class="val">${c.costo !== null ? soles(c.costo) : "—"}</div><div class="note">con bonificaciones</div></div>
    </div>
    <section class="card"><div><h2>Conteo físico</h2><p class="sub">Si al contar hay diferencia, corrige el stock. Queda registrado.</p></div>
      <div class="row"><input id="conteo" class="grow" inputmode="decimal" placeholder="Cantidad contada"><select id="motivo" style="width:auto"><option value="conteo">Conteo</option><option value="merma">Merma / dañado</option><option value="consumo">Consumo propio</option></select><button class="btn primary" data-act="guardar-conteo">Guardar</button></div></section>
    <section class="card"><h2>Compras de este producto</h2>
      ${hist.length ? `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Proveedor</th><th class="r">Llegó</th><th class="r">Pagó</th></tr></thead><tbody>
        ${hist.map(h => `<tr><td>${fecha(h.r.fecha)}</td><td>${esc(prov(h.r.proveedor_id)?.nombre || "—")}${h.observacion ? ` <span class="pill warn">${esc(h.observacion)}</span>` : ""}</td><td class="r">${num(h.cantidad,2)} ${esc(h.unidad_compra)}</td><td class="r">${h.bonificacion ? '<span class="pill bonus">Gratis</span>' : soles(h.importe)}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted" style="margin:0">Sin compras.</p>`}</section>
    <section class="card"><h2>Datos del producto</h2>
      <div class="grid2">
        <label class="f">Nombre<input id="e-nombre" value="${esc(p.nombre)}"></label>
        <label class="f">Marca<input id="e-marca" value="${esc(p.marca || "")}"></label>
        <label class="f">Línea<input id="e-linea" value="${esc(p.linea || "")}" list="dlLinea3"></label>
        <label class="f">Lo vendo por<select id="e-unidad">${UNIDADES.map(u => `<option ${u===uv(p)?"selected":""}>${u}</option>`).join("")}</select></label>
        <label class="f">Precio de venta S/<input id="e-pv" inputmode="decimal" value="${p.precio_venta ?? ""}"></label>
        <label class="f">Stock mínimo<input id="e-min" inputmode="decimal" value="${p.stock_minimo || ""}"></label>
      </div>
      <datalist id="dlLinea3">${LINEAS.map(l => `<option value="${l}">`).join("")}</datalist>
      <button class="btn primary" data-act="guardar-producto">Guardar cambios</button></section>
  </div></div>`;
}
function cerrarFicha(){ S.abierto = null; $("#overlayRoot").innerHTML = ""; }

// ----- Créditos -----
function vistaCreditos(){
  const pend = S.recepciones.filter(r => r.condicion === "credito" && !r.pagado).sort((a,b) => (a.vence||"").localeCompare(b.vence||""));
  const pagados = S.recepciones.filter(r => r.condicion === "credito" && r.pagado).slice(0,15);
  const total = pend.reduce((a,r) => a+toNum(r.total), 0);
  return `<div class="row between"><div><h1>Créditos con proveedores</h1><p class="sub">Compras a crédito que falta pagar · ${soles(total)}</p></div>
    ${pend.length ? `<button class="btn wa" data-act="wa-creditos">${waIcon()} Avisar por WhatsApp</button>` : ""}</div>
  <section class="card">${pend.length ? `<div class="tbl"><table><thead><tr><th>Proveedor</th><th>Boleta</th><th class="r">Monto</th><th>Vence</th><th></th></tr></thead><tbody>
    ${pend.map(r => { const e = estadoCredito(r); return `<tr><td><b>${esc(prov(r.proveedor_id)?.nombre || "—")}</b><br><span class="small muted">Recibido ${fecha(r.fecha)} · ${r.dias_credito} días</span></td><td class="mono">${esc(r.documento || "—")}</td><td class="r"><b>${soles(r.total)}</b></td><td><span class="pill ${e.cls}">${e.txt}</span></td><td class="r"><button class="btn sm" data-act="pagar" data-id="${r.id}">Marcar pagado</button></td></tr>`; }).join("")}
  </tbody></table></div>` : `<p class="muted" style="margin:0">No hay créditos pendientes.</p>`}</section>
  ${pagados.length ? `<section class="card"><h2>Pagados</h2><div class="tbl"><table><tbody>${pagados.map(r => `<tr><td>${esc(prov(r.proveedor_id)?.nombre || "—")}</td><td class="r">${soles(r.total)}</td><td class="r">pagado ${fecha(r.fecha_pago)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}`;
}

// ----- Proveedores -----
function vistaProveedores(){
  return `<div><h1>Proveedores</h1><p class="sub">Se crean solos al recibir mercadería. Aquí completas su teléfono y sus días de crédito habituales.</p></div>
  <section class="card">${S.proveedores.length ? S.proveedores.map(p => `<div class="grid2" style="align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line)">
    <label class="f">Nombre<input data-pv="${p.id}" data-k="nombre" value="${esc(p.nombre)}"></label>
    <label class="f">RUC<input data-pv="${p.id}" data-k="ruc" value="${esc(p.ruc || "")}" inputmode="numeric"></label>
    <label class="f">Teléfono / WhatsApp<input data-pv="${p.id}" data-k="telefono" value="${esc(p.telefono || "")}" inputmode="tel"></label>
    <label class="f">Días de crédito<input data-pv="${p.id}" data-k="dias_credito" value="${p.dias_credito || 0}" inputmode="numeric"></label>
    <button class="btn" data-act="guardar-prov" data-id="${p.id}">Guardar</button></div>`).join("") : `<p class="muted" style="margin:0">Aún no hay proveedores.</p>`}</section>`;
}

// ----- Más -----
function vistaMas(){
  return `<div><h1>Más</h1></div>
  <section class="card">
    <button class="btn big" data-go="inventario">Inventario general</button>
    <button class="btn big" data-go="creditos">Créditos con proveedores</button>
    <button class="btn big" data-go="proveedores">Proveedores</button>
  </section>
  <section class="card"><h2>WhatsApp para los avisos</h2><p class="sub" style="margin:0">Número que recibe el resumen (con código de país, ej. 51987654321). Si lo dejas vacío, WhatsApp te deja elegir el contacto.</p>
    <div class="row"><input id="wa-num" class="grow" inputmode="tel" value="${esc(LS.get("kardex-wa") || "")}" placeholder="51…"><button class="btn" data-act="guardar-wa">Guardar</button></div></section>
  <section class="card"><h2>Este equipo</h2><button class="btn danger" data-act="salir">Cerrar sesión en este equipo</button></section>`;
}

// ---------- Eventos ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-act]"); if(!t) return;
  if(t.dataset.go){ if(t.dataset.go === "recibir" && S.view !== "recibir") S.rec = S.rec || null; ir(t.dataset.go); return; }
  const a = t.dataset.act, id = t.dataset.id;
  try{
    if(a === "cerrar-fondo"){ if(e.target === t) cerrarFicha(); }
    else if(a === "abrir"){ S.abierto = id; renderFicha(); }
    else if(a === "cerrar") cerrarFicha();
    else if(a === "wa-resumen") abrirWhatsApp(mensajeResumen());
    else if(a === "wa-creditos"){ const L = ["*Créditos por pagar*"]; S.recepciones.filter(r => r.condicion === "credito" && !r.pagado).sort((x,y) => (x.vence||"").localeCompare(y.vence||"")).forEach(r => L.push(`• ${prov(r.proveedor_id)?.nombre || "Proveedor"} ${soles(r.total)} – ${estadoCredito(r).txt}`)); abrirWhatsApp(L.join("\n")); }
    else if(a === "guardar-wa"){ LS.set("kardex-wa", $("#wa-num").value.trim()); toast("Número guardado."); }
    else if(a === "salir"){ salir(); }
    // Vender
    else if(a === "sel-venta"){ S.venta.sel = id || null; const p = prod(id); S.venta.cant = 1; S.venta.precio = p?.precio_venta ?? ""; render(); if(id) setTimeout(() => $("#panelVenta")?.scrollIntoView({behavior:"smooth", block:"center"}), 30); }
    else if(a === "cant"){ S.venta.cant = Math.max(0, toNum(S.venta.cant) + toNum(t.dataset.d)); render(); }
    else if(a === "registrar-venta"){
      const p = prod(S.venta.sel), cant = toNum(S.venta.cant), precio = toNum(S.venta.precio);
      if(!(cant > 0)){ toast("Pon una cantidad mayor que 0."); return; }
      t.disabled = true;
      await insertar("ventas", {producto_id:p.id, cantidad:cant, precio_unit: precio || null, total: Math.round(cant*precio*100)/100});
      if(precio && precio !== toNum(p.precio_venta)) await actualizar("productos", p.id, {precio_venta:precio});
      S.venta = {q:S.venta.q, sel:null, cant:1, precio:""}; await refrescar(true); toast(`Venta registrada: ${num(cant,2)} ${plural(uv(p),cant)} de ${p.nombre}.`);
    }
    else if(a === "anular-venta"){ if(t.dataset.ok !== "1"){ t.dataset.ok = "1"; t.textContent = "¿Seguro?"; return; } await borrar("ventas", id); await refrescar(true); toast("Venta anulada."); }
    // Pedidos
    else if(a === "nuevo-pedido"){ S.pedido = {proveedor:"", entrega: sumarDias(hoy(),1), lineas:[{nombre:"", cantidad:1, unidad:"CAJA", factor:1}]}; ir("pedidos"); }
    else if(a === "add-pl"){ S.pedido.lineas.push({nombre:"", cantidad:1, unidad:"CAJA", factor:1}); render(); }
    else if(a === "del-pl"){ S.pedido.lineas.splice(+t.dataset.i, 1); if(!S.pedido.lineas.length) S.pedido.lineas.push({nombre:"", cantidad:1, unidad:"CAJA", factor:1}); render(); }
    else if(a === "cancelar-pedido-form"){ S.pedido = null; render(); }
    else if(a === "guardar-pedido") await guardarPedido(t);
    else if(a === "cerrar-pedido"){ if(t.dataset.ok !== "1"){ t.dataset.ok = "1"; t.textContent = "Confirmar"; return; } await actualizar("pedidos", id, {estado:"cerrado"}); await refrescar(true); toast("Pedido cerrado."); }
    else if(a === "recibir-pedido") nuevaRecepcion(id);
    // Recibir
    else if(a === "recibir-directo") nuevaRecepcion(null);
    else if(a === "descartar-rec"){ S.rec = null; render(); }
    else if(a === "leer") leerBoleta();
    else if(a === "cond"){ S.rec.condicion = t.dataset.v; render(); }
    else if(a === "add-grupo"){ S.rec.grupos.push(grupoVacio()); render(); }
    else if(a === "add-linea"){ S.rec.grupos[+t.dataset.g].lineas.push(lineaVacia()); render(); }
    else if(a === "del-linea"){ const g = S.rec.grupos[+t.dataset.g]; g.lineas.splice(+t.dataset.l, 1); if(!g.lineas.length && !g.pedidoUnidades) S.rec.grupos.splice(+t.dataset.g, 1); if(!S.rec.grupos.length) S.rec.grupos.push(grupoVacio()); render(); }
    else if(a === "guardar-rec") await guardarRecepcion(t);
    // Ficha, créditos, proveedores
    else if(a === "guardar-conteo"){
      const p = prod(S.abierto), v = $("#conteo").value.trim(); if(v === ""){ toast("Escribe la cantidad que contaste."); return; }
      const dif = Math.round((toNum(v) - (S.stock.get(p.id) ?? 0))*100)/100;
      if(dif === 0){ toast("Coincide con el sistema."); return; }
      await insertar("ajustes", {producto_id:p.id, cantidad:dif, motivo:$("#motivo").value}); await refrescar(true); renderFicha(); toast(`Stock corregido (${dif > 0 ? "+" : ""}${num(dif,2)}).`);
    }
    else if(a === "guardar-producto"){
      const p = prod(S.abierto), val = k => $("#"+k).value.trim(), nombre = val("e-nombre");
      if(!nombre){ toast("El nombre no puede quedar vacío."); return; }
      const dup = porNombre(nombre); if(dup && dup.id !== p.id){ toast(`Ya existe "${dup.nombre}".`); return; }
      await actualizar("productos", p.id, {nombre, marca:val("e-marca") || null, linea:val("e-linea") || null, unidad_venta:val("e-unidad"), precio_venta: val("e-pv") === "" ? null : toNum(val("e-pv")), stock_minimo: toNum(val("e-min"))});
      await refrescar(true); renderFicha(); toast("Producto actualizado.");
    }
    else if(a === "pagar"){ if(t.dataset.ok !== "1"){ t.dataset.ok = "1"; t.textContent = "Confirmar pago"; return; } await actualizar("recepciones", id, {pagado:true, fecha_pago:hoy()}); await refrescar(true); toast("Crédito marcado como pagado."); }
    else if(a === "guardar-prov"){
      const cambios = {}; document.querySelectorAll(`[data-pv="${id}"]`).forEach(i => cambios[i.dataset.k] = i.dataset.k === "dias_credito" ? Math.round(toNum(i.value)) : (i.value.trim() || null));
      if(!cambios.nombre){ toast("El nombre no puede quedar vacío."); return; }
      await actualizar("proveedores", id, cambios); await refrescar(true); toast("Proveedor guardado.");
    }
  }catch(err){ t.disabled = false; toast("No se pudo completar: " + (err.message || "revisa tu conexión")); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.abierto) cerrarFicha();
  if((e.key === "Enter" || e.key === " ") && e.target.matches?.("tr[data-act='abrir']")){ e.preventDefault(); S.abierto = e.target.dataset.id; renderFicha(); }
});
document.addEventListener("submit", async e => {
  if(e.target.id !== "formLogin") return; e.preventDefault();
  const clave = $("#clave").value.trim(); const msg = $("#loginMsg");
  if(!clave){ msg.textContent = "Escribe la clave."; return; }
  msg.textContent = "Comprobando…";
  try{
    const r = await fetch(`${SB_URL}/rest/v1/rpc/clave_ok`, {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json", "x-clave-tienda":clave}, body:"{}"});
    if(r.ok && (await r.json()) === true){ S.clave = clave; LS.set("kardex-clave", clave); render(); await refrescar(true); }
    else msg.textContent = "Esa clave no es correcta.";
  }catch{ msg.textContent = "Sin conexión. Revisa el internet e intenta de nuevo."; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "f-q"){ S.f.q = t.value; const pos = t.selectionStart; render(); const n = $("#f-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.id === "v-q"){ S.venta.q = t.value; $("#tiles").innerHTML = tilesVenta(); return; }
  if(t.id === "v-cant" || t.id === "v-precio"){ S.venta[t.id === "v-cant" ? "cant" : "precio"] = t.value; $("#v-total").textContent = soles(toNum(S.venta.cant)*toNum(S.venta.precio)); return; }
  if(t.dataset.pf){ S.pedido[t.dataset.pf] = t.value; return; }
  if(t.dataset.pl !== undefined){ S.pedido.lineas[+t.dataset.pl][t.dataset.k] = t.value; if(t.dataset.k === "nombre"){ const p = porNombre(t.value); if(p){ const big = Object.entries(p.presentaciones||{}).sort((a,b) => b[1]-a[1])[0]; if(big){ S.pedido.lineas[+t.dataset.pl].unidad = big[0]; S.pedido.lineas[+t.dataset.pl].factor = big[1]; } } } return; }
  const d = S.rec; if(!d) return;
  if(t.dataset.h){ d[t.dataset.h] = t.value; if(t.dataset.h === "total") $("#cuadre").innerHTML = cuadreHtml(); return; }
  if(t.dataset.g === undefined) return;
  const g = d.grupos[+t.dataset.g]; if(!g) return;
  if(t.dataset.nf && t.tagName !== "SELECT"){ g.nuevo[t.dataset.nf] = t.value; return; }
  if(t.dataset.lf && t.type !== "checkbox" && t.tagName !== "SELECT"){
    g.lineas[+t.dataset.l][t.dataset.lf] = t.value;
    const p = prod(g.productoId), u = p ? uv(p) : g.nuevo.unidadVenta, rec = g.lineas.reduce((a,l) => a+toNum(l.cantidad)*toNum(l.factor), 0);
    const el = $(`#u-${t.dataset.g}`); if(el) el.textContent = `Entran ${num(rec,2)} ${plural(u,rec)}`;
    if(t.dataset.lf === "importe") $("#cuadre").innerHTML = cuadreHtml();
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if(["f-linea","f-marca","f-prov"].includes(t.id)){ S.f[t.id.slice(2)] = t.value; render(); return; }
  if(t.dataset.pl !== undefined && t.dataset.k === "nombre"){ render(); return; }
  if(t.dataset.pf === "proveedor") return;
  if(t.id === "foto" && t.files?.[0]){
    try{ const {im, url} = await cargarImagen(t.files[0]); Object.assign(S.rec, {img:im, url, error:"", leida:false}); render(); leerBoleta(); }
    catch{ S.rec.error = "No pude abrir esa imagen. Prueba con otra foto."; render(); }
    return;
  }
  const d = S.rec; if(!d || t.dataset.g === undefined) return;
  const g = d.grupos[+t.dataset.g]; if(!g) return;
  if(t.dataset.gf === "productoId"){ g.productoId = t.value; const p = prod(t.value); if(p) g.lineas.forEach(l => { const f = p.presentaciones?.[String(l.unidadCompra).toUpperCase().trim()]; if(f) l.factor = f; }); render(); }
  else if(t.dataset.nf === "nombre") render();
  else if(t.dataset.nf){ g.nuevo[t.dataset.nf] = t.value; render(); }
  else if(t.dataset.lf === "bonificacion") g.lineas[+t.dataset.l].bonificacion = t.checked;
  else if(t.dataset.lf === "observacion"){ g.lineas[+t.dataset.l].observacion = t.value; }
});

async function guardarPedido(btn){
  const d = S.pedido, lineas = d.lineas.filter(l => l.nombre.trim() && toNum(l.cantidad) > 0);
  if(!d.proveedor.trim()){ toast("Escribe el proveedor."); return; }
  if(!lineas.length){ toast("Agrega al menos un producto."); return; }
  btn.disabled = true;
  let pr = S.proveedores.find(p => norm(p.nombre) === norm(d.proveedor));
  if(!pr) [pr] = await insertar("proveedores", {nombre:d.proveedor.trim()});
  const items = [];
  for(const l of lineas){
    let p = porNombre(l.nombre);
    if(!p){ [p] = await insertar("productos", {nombre:l.nombre.trim(), presentaciones:{[String(l.unidad||"UN").toUpperCase()]: toNum(l.factor) || 1}}); S.productos.push(p); }
    items.push({producto_id:p.id, cantidad:toNum(l.cantidad), unidad_compra:String(l.unidad||"UN").toUpperCase().trim(), factor:toNum(l.factor) || 1});
  }
  const [pe] = await insertar("pedidos", {proveedor_id:pr.id, entrega:d.entrega || null});
  await insertar("pedido_items", items.map(i => ({...i, pedido_id:pe.id})));
  S.pedido = null; await refrescar(true); toast("Pedido guardado. Cuando llegue, tócalo para recibirlo.");
}
function salir(){ LS.del("kardex-clave"); S.clave = null; S.conectado = false; render(); }

// ---------- Inicio ----------
render();
if(S.clave) refrescar(true);
setInterval(() => { if(document.visibilityState === "visible" && S.clave) refrescar(false); }, 15000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.clave) refrescar(false); });
</script>
</body>
</html>
