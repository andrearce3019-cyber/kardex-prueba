<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kardex de la Tienda</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12A37F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera con pestañas en computadora; en celular, barra de navegación fija abajo y una sola columna. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#172131; --muted:#5B6779; --line:#DCE1E8; --soft:#EEF1F5;
  --accent:#2347C5; --accent-weak:#E6EBFB; --on-accent:#FFFFFF;
  --ok:#1B7A48; --ok-weak:#E3F3EA; --warn:#9A5B00; --warn-weak:#FBF0DC; --bad:#BF2D27; --bad-weak:#FBE6E4;
  --bonus:#7140B0; --bonus-weak:#F0E8FA; --wa:#1E8E4E;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#97A2B2; --line:#283241; --soft:#1C2430;
  --accent:#7F9CFF; --accent-weak:#1D2A4F; --on-accent:#0E131A;
  --ok:#4FC587; --ok-weak:#15301F; --warn:#E6A33C; --warn-weak:#33260F; --bad:#FF6E66; --bad-weak:#3A1A18;
  --bonus:#BC8EF2; --bonus-weak:#2A1D3D; --wa:#4FC587; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#97A2B2; --line:#283241; --soft:#1C2430;
  --accent:#7F9CFF; --accent-weak:#1D2A4F; --on-accent:#0E131A;
  --ok:#4FC587; --ok-weak:#15301F; --warn:#E6A33C; --warn-weak:#33260F; --bad:#FF6E66; --bad-weak:#3A1A18;
  --bonus:#BC8EF2; --bonus-weak:#2A1D3D; --wa:#4FC587; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
img{max-width:100%}[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:10px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.72rem;font-weight:400;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.live.off i{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs button{all:unset;cursor:pointer;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
nav.bottom{display:none}
@media (max-width:720px){
  nav.tabs{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  nav.bottom button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 0}
  nav.bottom button svg{width:22px;height:22px}
  nav.bottom button[aria-current="true"]{color:var(--accent)}
  main{padding-bottom:96px!important}
}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:20px 64px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem}h2{font-size:1.12rem}h3{font-size:1rem}
.sub{color:var(--muted);margin:2px 0 0}
.mono{font-family:var(--f-mono);font-size:.85em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 200px;min-width:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:9px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;min-height:42px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem;min-height:32px}
.btn.big{padding:14px 18px;font-size:1.02rem;width:100%}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--accent)}
.kpi .lab{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .note{font-size:.82rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.bajo,.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.quiebre,.pill.agotado,.pill.bad{background:var(--bad-weak);color:var(--bad)}
.pill.sindatos,.pill.sinmin,.pill.porllegar,.pill.gris{background:var(--soft);color:var(--muted)}
.pill.bonus{background:var(--bonus-weak);color:var(--bonus)}
.pill.tag{background:var(--accent-weak);color:var(--accent)}
.alerta{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--soft)}
.alerta .dot{width:10px;height:10px;border-radius:50%}
.alerta.bad .dot{background:var(--bad)}.alerta.warn .dot{background:var(--warn)}.alerta.info .dot{background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters>*{flex:1 1 150px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;min-height:42px}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type="checkbox"]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--bonus)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
.empty p{max-width:46ch;margin:0;color:var(--muted)}
.banner{padding:10px 14px;border-radius:9px;background:var(--warn-weak);color:var(--warn);font-size:.9rem}
.banner.info{background:var(--accent-weak);color:var(--accent)}
.banner.bad{background:var(--bad-weak);color:var(--bad)}
.banner.ok{background:var(--ok-weak);color:var(--ok)}
/* Vender */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;align-content:start}
.tile:hover,.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .n{font-weight:600;line-height:1.25}
.tile .s{font-size:.82rem;color:var(--muted)}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;align-items:center}
.stepper input{text-align:center;font-size:1.3rem;font-weight:700}
.stepper .btn{font-size:1.4rem;min-height:52px}
/* Recibir */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;justify-items:center;text-align:center;background:var(--soft)}
.drop img{max-height:200px;border-radius:8px;border:1px solid var(--line)}
.recibir-grid{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
.foto-lado{position:sticky;top:120px}
.foto-lado img{width:100%;max-height:68vh;object-fit:contain;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--soft)}
@media (max-width:900px){.recibir-grid{grid-template-columns:minmax(0,1fr)}.foto-lado{position:static}.foto-lado img{max-height:240px}}
table.boleta{min-width:900px}
table.boleta td{padding:4px}
table.boleta input,table.boleta select{min-height:38px;padding:6px 8px}
table.boleta td.n input{text-align:right;font-variant-numeric:tabular-nums;min-width:70px}
table.boleta td.prod{min-width:230px}
table.boleta td.c{text-align:center}
table.boleta tr.bon td{background:var(--bonus-weak)}
table.boleta tr.falta td{background:var(--bad-weak)}
table.boleta tr.nollego td{opacity:.55}
table.boleta .hint{font-size:.74rem;margin-top:3px;line-height:1.3}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;font-weight:600}
@media (max-width:720px){
  table.boleta{min-width:0}
  table.boleta thead{display:none}
  table.boleta tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  table.boleta td{border:0;padding:0}
  table.boleta td.prod{grid-column:1/-1}
  table.boleta td[data-l]::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:2px}
  table.boleta td.c{text-align:left}
}
.zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);overflow:auto;padding-top:64px}
.zoom img{display:block;margin:0 auto;max-width:none}
.zoom-bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:41;display:flex;gap:8px}
.cuadre{font-weight:600;padding:10px 12px;border-radius:9px}
.cuadre.ok{background:var(--ok-weak);color:var(--ok)}.cuadre.bad{background:var(--warn-weak);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
/* Ficha */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.stat .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .val{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.stat .note{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.login{max-width:420px;margin:12vh auto 0}
/* Rediseño: cabecera verde botica, menú en pastillas, tarjetas con sombra suave */
:root{--accent:#0E7C66;--accent-weak:#DCF2EB;--on-accent:#FFFFFF;--bg:#F2F5F4;--surface:#FFFFFF;--line:#DCE4E1;--soft:#EDF2F0;--ink:#13211D;--muted:#566863;--brand:#0B3B33;--brand-ink:#F2FBF8;--shadow:0 1px 2px rgba(16,40,34,.06),0 6px 18px rgba(16,40,34,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#3FCBA8;--accent-weak:#123B32;--on-accent:#06201A;--bg:#0C1412;--surface:#131D1A;--line:#24332F;--soft:#18231F;--ink:#E4EEEB;--muted:#93A6A0;--brand:#0A2722;--brand-ink:#E4F7F1;--shadow:none}}
:root[data-theme="dark"]{--accent:#3FCBA8;--accent-weak:#123B32;--on-accent:#06201A;--bg:#0C1412;--surface:#131D1A;--line:#24332F;--soft:#18231F;--ink:#E4EEEB;--muted:#93A6A0;--brand:#0A2722;--brand-ink:#E4F7F1;--shadow:none}
header{background:var(--brand);border-bottom:0;color:var(--brand-ink)}
header .brand{color:var(--brand-ink);font-size:1.4rem}
header .live{color:rgba(242,251,248,.72)}
nav.tabs{gap:6px;padding-bottom:12px;margin-bottom:0}
nav.tabs button{border:0;border-radius:999px;padding:8px 14px;color:rgba(242,251,248,.78)}
nav.tabs button:hover{background:rgba(255,255,255,.08)}
nav.tabs button[aria-current="true"]{background:rgba(255,255,255,.18);color:#fff}
header .btn.primary{background:#fff;border-color:#fff;color:#0B3B33}
main{gap:20px}
h1{font-size:1.75rem}
.card,.kpi{box-shadow:var(--shadow)}
.card{border-radius:14px;padding:18px}
.kpi{border-radius:14px;padding:16px 18px;border-top:3px solid var(--accent)}
.kpi .val{font-size:1.75rem}
.btn{border-radius:10px}
.alerta{border-radius:12px;padding:12px 14px}
.pedido-rec{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
table th{background:var(--soft)}
table th:first-child{border-top-left-radius:8px}table th:last-child{border-top-right-radius:8px}
.login .card,.login{box-shadow:var(--shadow)}
nav.bottom button[aria-current="true"] svg{stroke-width:2.4}
/* Menú lateral en computadora */
nav.tabs button{display:inline-flex;align-items:center;gap:8px}
nav.tabs button svg{width:18px;height:18px;flex:none;opacity:.9}
@media (min-width:1000px){
  header{position:fixed;inset:0 auto 0 0;width:256px;overflow-y:auto;background:linear-gradient(180deg,#0B3B33 0%,#082C26 100%)}
  header .wrap{padding:22px 14px;max-width:none;display:flex;flex-direction:column;gap:22px;min-height:100%}
  header .top{flex-direction:column;align-items:stretch;padding:0 6px;gap:16px}
  header .brand{font-size:1.6rem;flex-direction:column;align-items:flex-start;gap:4px}
  #btnVenderTop{width:100%;min-height:44px}
  nav.tabs{flex-direction:column;overflow:visible;gap:3px;padding:0}
  nav.tabs button{display:flex;width:100%;box-sizing:border-box;border-radius:10px;padding:11px 12px;font-size:.95rem}
  nav.tabs button[data-go="pruebas"]{margin-top:14px;color:rgba(255,200,190,.85)}
  main.wrap{margin-left:256px;max-width:1180px;padding-left:40px;padding-right:40px;padding-block:32px 64px}
  body::before{display:none}
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header{background:linear-gradient(180deg,#0A2722 0%,#071C18 100%)}}
:root[data-theme="dark"] header{background:linear-gradient(180deg,#0A2722 0%,#071C18 100%)}
/* Inicio vacío: pasos */
.bienvenida{display:grid;gap:6px}
.bienvenida h1{font-size:2rem}
.pasos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.pasos{grid-template-columns:minmax(0,1fr)}}
.paso{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow);position:relative;overflow:hidden}
.paso .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-weak);color:var(--accent)}
.paso .ico svg{width:24px;height:24px}
.paso .n{position:absolute;top:12px;right:16px;font-family:var(--f-display);font-size:2.6rem;font-weight:700;color:var(--soft);line-height:1}
.paso h3{font-size:1.08rem}
.paso p{margin:0;color:var(--muted);font-size:.92rem}
/* Confirmación tipo boleta */
.overlay.centro{justify-content:center;align-items:center;padding:16px}
.recibo{background:var(--surface);width:min(620px,100%);max-height:calc(100vh - 32px);overflow-y:auto;border-radius:18px;padding:0 0 18px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.recibo>*:not(.recibo-h){margin-inline:18px}
.recibo-h{background:var(--brand);color:var(--brand-ink);padding:18px;display:grid;gap:4px;border-radius:18px 18px 0 0}
.recibo-h h2{font-size:1.3rem}
.recibo-t{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);padding-top:12px;font-weight:600}
.recibo-t b{font-family:var(--f-display);font-size:1.5rem}
/* Borrar pruebas */
.grid-borrar{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.fila-borrar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fila-borrar.dia{border-top:2px solid var(--line);margin-top:6px}
.zona-peligro{border-color:var(--bad)}

/* ===== Diseño 3: claro, luminoso y amable (un solo estilo, también con el celular en modo oscuro) ===== */
:root,
:root[data-theme="dark"]{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#1B2236; --muted:#6A7288; --line:#E6E9F2; --soft:#F2F4F9;
  --accent:#12A37F; --accent-weak:#E3F6F0; --on-accent:#FFFFFF;
  --ok:#139669; --ok-weak:#E2F5EC; --warn:#C27A05; --warn-weak:#FFF3DB; --bad:#E0464B; --bad-weak:#FDE9EA;
  --bonus:#7C5CE0; --bonus-weak:#F0EBFF; --brand:#12A37F; --brand-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(27,34,54,.04),0 8px 24px rgba(27,34,54,.06);
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;

function palabras(s){ return new Set(norm(s).split(" ").filter(w => w.length > 2 && !/^\d+$/.test(w))); }
function parecido(a,b){ const A = palabras(a), B = palabras(b); if(!A.size || !B.size) return 0; let c = 0; A.forEach(w => { if(B.has(w)) c++; }); return c/Math.min(A.size,B.size); }
const parecidos = (nombre, excluir) => S.productos.filter(p => p.id !== excluir && parecido(nombre, p.nombre) >= 0.75);

const porAlias = desc => { const n = norm(desc); return S.productos.find(p => (p.alias||[]).includes(n) || norm(p.nombre) === n); };

async function api(path, {method = "GET", body, prefer} = {}){
  const h = {apikey: SB_KEY, "Content-Type": "application/json", "x-clave-tienda": S.clave || ""};
  if(prefer) h.Prefer = prefer;
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {method, headers: h, body: body === undefined ? undefined : JSON.stringify(body)});
  if(!r.ok){ let m = ""; try{ m = (await r.json()).message; }catch{} const e = new Error(m || ("HTTP "+r.status)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const insertar = (tabla, filas) => api(tabla, {method:"POST", body: filas, prefer:"return=representation"});
const actualizar = (tabla, id, cambios) => api(`${tabla}?id=eq.${id}`, {method:"PATCH", body: cambios, prefer:"return=representation"});
const borrar = (tabla, id) => api(`${tabla}?id=eq.${id}`, {method:"DELETE"});

async function cargar(){
  if(S.cargando || !S.clave) return; S.cargando = true;
  try{
    const desde = new Date(Date.now() - 31*86400000).toISOString();
    const [productos, proveedores, pedidos, pitems, recepciones, ritems, ventas, stock, config] = await Promise.all([
      api("productos?select=*&order=nombre"), api("proveedores?select=*&order=nombre"),
      api("pedidos?select=*&order=creado.desc&limit=300"), api("pedido_items?select=*"),
      api("recepciones?select=*&order=fecha.desc&limit=500"), api("recepcion_items?select=*"),
      api(`ventas?select=*&creado=gte.${desde}&order=creado.desc`), api("stock_productos?select=*"), api("config_tienda?select=*").catch(() => [])
    ]);
    Object.assign(S, {productos, proveedores, pedidos, pitems, recepciones, ritems, ventas, config: config[0] || {}, conectado:true});
    S.stock = new Map(stock.map(s => [s.producto_id, toNum(s.recibido) - toNum(s.vendido) + toNum(s.ajustado)]));
    marcarVivo(true);
  }catch(e){ marcarVivo(false); if(e.status === 401 || e.status === 403) salir(); }

}

// ---------- Cálculos ----------
function calc(p){
  const stock = S.stock.get(p.id) ?? 0;
  const its = S.ritems.filter(i => i.producto_id === p.id);
  let uni = 0, gasto = 0, bon = 0;
  its.forEach(i => { uni += toNum(i.unidades); gasto += toNum(i.importe); if(i.bonificacion) bon += toNum(i.unidades); });
  const costo = uni > 0 ? gasto/uni : null;
  const vs = S.ventas.filter(v => v.producto_id === p.id);
  const vendidoHoy = vs.filter(v => diaLocal(v.creado) === hoy()).reduce((a,v) => a+toNum(v.cantidad), 0);
  const vendido30 = vs.reduce((a,v) => a+toNum(v.cantidad), 0);
  const primera = vs.length ? diaLocal(vs[vs.length-1].creado) : null;
  const dias = primera ? Math.max(1, Math.min(30, diasEntre(primera, hoy()) + 1)) : 0;
  const consumo = primera ? vendido30/dias : null;
  const cobertura = consumo > 0 ? stock/consumo : null;
  let estado = "ok";
  if(stock <= 0) estado = its.length ? "agotado" : "porllegar";
  else if((toNum(p.stock_minimo) > 0 && stock <= toNum(p.stock_minimo)) || (cobertura !== null && cobertura <= DIAS_QUIEBRE)) estado = "quiebre";
  else if(toNum(p.stock_minimo) > 0 && stock <= toNum(p.stock_minimo) * 1.5) estado = "bajo";
  else if(cobertura !== null && cobertura <= DIAS_BAJO) estado = "bajo";
  else if(!(toNum(p.stock_minimo) > 0)) estado = "sinmin";
  let sugerido = null;
  if(consumo > 0){ const falta = consumo*DIAS_PEDIDO - stock; if(falta > 0){
    const big = Object.entries(p.presentaciones||{}).filter(([,f]) => f > 1).sort((a,b) => b[1]-a[1])[0];
    sugerido = big ? {cant:Math.ceil(falta/big[1]), unidad:big[0]} : {cant:Math.ceil(falta), unidad:uv(p)}; } }
  const provs = new Set(its.map(i => S.recepciones.find(r => r.id === i.recepcion_id)?.proveedor_id).filter(Boolean));
  return {stock, costo, bon, vendidoHoy, consumo, cobertura, estado, sugerido, provs, valor: costo !== null ? Math.max(0,stock)*costo : 0};
}
const ESTADO = {porllegar:"Por llegar", agotado:"Agotado", quiebre:"Bajo el mínimo", bajo:"Cerca del mínimo", ok:"Bien", sinmin:"Sin mínimo"};
const ORDEN = {porllegar:3, agotado:0, quiebre:1, bajo:2, sinmin:3, ok:4};
// Presentación tipo almacén: stock en el empaque mayor (CJ), su factor y las unidades
const ABREV = {CAJA:"CJ", caja:"CJ", UN:"UND", unidad:"UND", paquete:"PQT", PAQ:"PQT", PQT:"PQT", tira:"TIRA", TIRA:"TIRA", pack:"PACK", PACK:"PACK", POTE:"POTE", SACO:"SACO", docena:"DOC", DOC:"DOC", ciento:"CTO", bolsa:"BOL", BOLSA:"BOL", rollo:"ROL", botella:"BOT", "galón":"GAL", kilo:"KG", KG:"KG", FARDO:"FDO", LT:"LT"};
const abr = u => ABREV[u] || String(u || "").toUpperCase().slice(0,4);
function empaque(p){ const e = Object.entries(p.presentaciones || {}).filter(([,f]) => toNum(f) > 1).sort((a,b) => toNum(b[1]) - toNum(a[1]))[0]; return e ? {unidad:e[0], factor:toNum(e[1])} : null; }
const presentacionTxt = p => { const e = empaque(p); return e ? `${abr(e.unidad)}/${abr(uv(p))}` : abr(uv(p)); };
function stockTxt(p, u){ const e = empaque(p); if(!e) return `${num(u,2)} ${abr(uv(p))}`; const m = Math.floor(u / e.factor + 1e-9), resto = Math.round((u - m*e.factor)*100)/100; return `${m} ${abr(e.unidad)}${resto ? ` + ${num(resto,2)} ${abr(uv(p))}` : ""}`; }
// Búsqueda por nombre, marca, línea, código propio o descripción del proveedor
const coincide = (p, q) => norm([p.codigo, p.nombre, p.marca, p.linea, p.categoria, ...(p.alias || []).filter(a => !a.startsWith("#"))].join(" ")).includes(q) || norm(p.codigo || "").replace(/ /g,"").includes(q.replace(/ /g,""));
const pill = e => `<span class="pill ${e}">${ESTADO[e]}</span>`;
const cobTxt = c => c.cobertura === null ? "—" : c.cobertura > 365 ? "+1 año" : num(c.cobertura, c.cobertura < 10 ? 1 : 0)+" días";

function estadoCredito(r){
  if(r.condicion !== "credito" || r.pagado) return null;
  const d = diasEntre(hoy(), r.vence || r.fecha);
  return d < 0 ? {cls:"bad", txt:`Venció hace ${-d} día${d===-1?"":"s"}`, d} : d === 0 ? {cls:"bad", txt:"Vence hoy", d} : d <= DIAS_AVISO_CREDITO ? {cls:"warn", txt:`Vence en ${d} día${d===1?"":"s"}`, d} : {cls:"gris", txt:`Vence ${fecha(r.vence)}`, d};
}
function avancePedido(pe){
  const items = S.pitems.filter(i => i.pedido_id === pe.id);
  const recs = new Set(S.recepciones.filter(r => r.pedido_id === pe.id).map(r => r.id));
  const recibido = {}; S.ritems.filter(i => recs.has(i.recepcion_id)).forEach(i => recibido[i.producto_id] = (recibido[i.producto_id]||0) + toNum(i.unidades));
  let pedidas = 0, llegaron = 0;
  // Lo recibido de cada producto se reparte entre sus líneas (ej. la pagada y la de regalo)
  const lineas = items.map(i => { const u = toNum(i.cantidad)*toNum(i.factor); const r = Math.min(u, recibido[i.producto_id]||0); recibido[i.producto_id] = (recibido[i.producto_id]||0) - r; pedidas += u; llegaron += r; return {...i, unidadesPedidas:u, unidadesRecibidas:r, pendiente:Math.max(0,u-r)}; });
  return {lineas, pct: pedidas ? llegaron/pedidas : 0, recepciones: recs.size};
}

function mensajeResumen(){
  const C = new Map(S.productos.map(p => [p.id, calc(p)]));
  const valor = [...C.values()].reduce((a,c) => a+c.valor, 0);
  const L = [`*Kardex · ${fechaLarga(hoy())}*`, `Valor del inventario: ${soles(valor)} (${S.productos.length} productos)`];
  const riesgo = S.productos.filter(p => ["agotado","quiebre","bajo"].includes(C.get(p.id).estado));
  if(riesgo.length){ L.push("", "*Por agotarse:*"); riesgo.forEach(p => { const c = C.get(p.id); L.push(`• ${p.nombre}: quedan ${num(c.stock,1)}${c.sugerido ? ` → pedir ${c.sugerido.cant} ${c.sugerido.unidad.toLowerCase()}` : ""}`); }); }
  const creds = S.recepciones.map(r => ({r, e:estadoCredito(r)})).filter(x => x.e).sort((a,b) => a.e.d - b.e.d);
  if(creds.length){ L.push("", `*Créditos por pagar (${soles(creds.reduce((a,x) => a+toNum(x.r.total),0))}):*`); creds.forEach(({r,e}) => L.push(`• ${e.d <= DIAS_AVISO_CREDITO ? "⚠️ " : ""}${prov(r.proveedor_id)?.nombre || "Proveedor"} ${soles(r.total)} – ${e.txt}`)); }
  const atras = S.pedidos.filter(p => p.estado === "pendiente" && p.entrega && p.entrega < hoy());
  if(atras.length){ L.push("", "*Pedidos atrasados:*"); atras.forEach(p => L.push(`• ${prov(p.proveedor_id)?.nombre || "Proveedor"} (esperado ${fecha(p.entrega)})`)); }
  const porLlegar = S.pedidos.filter(p => p.estado === "pendiente" && !(p.entrega && p.entrega < hoy()));
  if(porLlegar.length){ L.push("", "*Pedidos por llegar:*"); porLlegar.forEach(p => L.push(`• ${prov(p.proveedor_id)?.nombre || "Proveedor"} – llega ${fecha(p.entrega)}`)); }
  // Detalle de stock por línea
  const lineas = {}; S.productos.forEach(p => (lineas[p.linea || "Sin línea"] ??= []).push(p));
  if(S.productos.length){ L.push("", "*Stock actual:*");
    Object.keys(lineas).sort().forEach(l => { L.push(`_${l}_`); lineas[l].sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(p => { const c = C.get(p.id); L.push(`• ${p.codigo ? p.codigo+" " : ""}${p.nombre}: ${num(c.stock,1)} ${plural(uv(p),c.stock)}`); }); }); }
  return L.join("\n");
}

function mensajeElegido(o){

  const filtro = [o.linea, o.marca].filter(Boolean).join(" · ");
  const L = [`*Kardex · ${fechaLarga(hoy())}*${filtro ? `\n_${filtro}_` : ""}`];
  const bloque = (titulo, lista) => { if(lista.length){ L.push("", `*${titulo}* (${lista.length})`); lista.forEach(p => L.push(linea(p))); } };
  if(o.sec.has("agotado")) bloque("🔴 Agotados", ps.filter(p => C.get(p.id).estado === "agotado"));
  if(o.sec.has("quiebre")) bloque("🟠 Bajo el mínimo", ps.filter(p => C.get(p.id).estado === "quiebre"));
  if(o.sec.has("bajo")) bloque("🟡 Cerca del mínimo", ps.filter(p => C.get(p.id).estado === "bajo"));
  if(o.sec.has("mucho")) bloque("🟢 Mucho stock", ps.filter(p => toNum(p.stock_minimo) > 0 && C.get(p.id).stock >= toNum(p.stock_minimo) * 3));
  if(o.sec.has("creditos")){ const cr = S.recepciones.map(r => ({r, e:estadoCredito(r)})).filter(x => x.e && x.e.d <= 7).sort((a,b) => a.e.d - b.e.d);
    if(cr.length){ L.push("", `*💳 Créditos por vencer* (${soles(cr.reduce((a,x) => a+toNum(x.r.total), 0))})`); cr.forEach(({r,e}) => L.push(`• ${prov(r.proveedor_id)?.nombre || "Proveedor"} ${soles(r.total)} – ${e.txt}`)); } }
  if(o.sec.has("pedidos")){ const at = S.pedidos.filter(p => p.estado === "pendiente" && p.entrega && p.entrega < hoy());
    if(at.length){ L.push("", `*🚚 Pedidos atrasados* (${at.length})`); at.forEach(p => L.push(`• ${prov(p.proveedor_id)?.nombre || "Proveedor"} – debía llegar el ${fecha(p.entrega)}`)); } }
  if(o.sec.has("todo")){ const porL = {}; ps.forEach(p => (porL[p.linea || "Sin línea"] ??= []).push(p));
    if(ps.length){ L.push("", "*📋 Inventario*"); Object.keys(porL).sort().forEach(l => { L.push(`_${l}_`); porL[l].forEach(p => L.push(linea(p))); }); } }
  if(L.length === 1) L.push("", "Sin novedades en lo seleccionado ✅");
  return L.join("\n");
}

function vistaPedidos(){

  const cer = hist.filter(pe => f === "todos" || estadoDe(pe) === f).slice(0, 60);

  const porProv = {};
  hist.forEach(pe => { const k = prov(pe.proveedor_id)?.nombre || "Proveedor", a = avancePedido(pe), e = estadoDe(pe);
    const x = porProv[k] ??= {total:0, completo:0, incompleto:0, cancelado:0, pedidas:0, llegaron:0};

    </details>`; };
  const filtros = [["todos","Todos",hist.length],["completo","Recibido completo",cuenta("completo")],["incompleto","Llegó incompleto",cuenta("incompleto")],["cancelado","Cancelado",cuenta("cancelado")]];
  return `
  <div class="row between"><div><h1>Pedidos</h1><p class="sub">Sube la boleta del pedido. Cuando llegue, lo recibes en Recibir mercadería y queda en el historial.</p></div>

  return its[0] ? toNum(its[0].i.precio_unit) : null;
}

async function leerBoletaPedido(){
  const d = S.pedido; if(!d?.img) return;
  d.leyendo = true; d.error = ""; render();
  try{
    const imagenes = [recorte(d.img,0,1), recorte(d.img,0,0.58), recorte(d.img,0.42,1)];
    const productos = S.productos.map(p => ({nombre:p.nombre, marca:p.marca, linea:p.linea, alias:(p.alias||[]).filter(a => !a.startsWith("#")).slice(0,8)}));
    const r = await fetch(`${SB_URL}/functions/v1/leer-boleta`, {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json", "x-clave-tienda":S.clave}, body: JSON.stringify({imagenes, productos})});
    const res = await r.json().catch(() => ({error:"conexion"}));
    if(!r.ok || res.error) throw res;
    if(res.proveedor) d.proveedor = (S.proveedores.find(p => parecido(p.nombre, res.proveedor) >= 0.6)?.nombre) || res.proveedor;
    d.documento = res.documento || d.documento; d.total = toNum(res.total) || d.total; d.ruc = res.ruc || "";
    if(res.condicion === "credito"){ d.condicion = "credito"; if(toNum(res.dias_credito) > 0) d.dias = toNum(res.dias_credito); } else if(res.condicion === "contado") d.condicion = "contado";
    d.dudas = Array.isArray(res.dudas) ? res.dudas.slice(0,6) : [];
    const items = res.items || [];
    if(items.length) d.lineas = items.map(it => {
      const desc = String(it.descripcion || "").trim(), ex = porCodigoProv(d.proveedor, it.codigo) || porAlias(desc) || porAliasParecido(desc) || porNombre(it.nombre || "");
      const uc = String(it.unidadCompra || "UN").toUpperCase().trim().replace(/^SAC$/,"SACO").replace(/^CJ$/,"CAJA").replace(/^UND$/,"UN");
      return {nombre: ex?.nombre || it.nombre || nombreBonito(desc), cantidad: toNum(it.cantidad) || 1, unidad: uc, factor: ex?.presentaciones?.[uc] || toNum(it.factor) || 1,
        codigoProv: it.codigo || "", unidadVenta: UNIDADES.includes(it.unidadVenta) ? it.unidadVenta : "unidad", empaque: it.empaque && toNum(it.empaque.factor) > 1 ? {unidad: String(it.empaque.unidad || "CAJA").toUpperCase().replace(/^CJ$/,"CAJA"), factor: toNum(it.empaque.factor)} : null, precio: toNum(it.precioUnit), bonif: !!it.bonificacion || toNum(it.importe) === 0, descripcion: desc, marca: it.marca || "", linea: it.linea || ""};
    });
    d.leida = true;
    toast(`Leí ${items.length} líneas${res.revisada ? " (revisadas dos veces)" : ""}. Revisa y guarda el pedido.`);
  }catch(e){
    d.error = ({falta_api_key:"La lectura no está activada: falta la clave gratuita de Gemini en Supabase.", api_key_invalida:"La clave de Gemini no es válida.",
      lento:"Google está muy ocupado en este momento. Espera un minuto y toca Leer otra vez.", conexion:"Google está saturado en este momento. Espera un minuto y toca Leer otra vez.", limite:"Se alcanzó el límite gratuito por ahora. Espera un minuto e intenta otra vez.", no_json:"No pude entender la boleta. Toma la foto más de cerca, completa y con buena luz.", clave:"La clave de la tienda no es válida. Vuelve a entrar."})[e?.error]
      || "No se pudo leer la boleta por un problema de conexión. Intenta de nuevo.";
  }finally{ d.leyendo = false; render(); }
}

function prepararOCR(im){
  const k = Math.min(2, 2400/Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth*k); c.height = Math.round(im.naturalHeight*k);
  const x = c.getContext("2d"); x.drawImage(im, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for(let i = 0; i < p.length; i += 4){ const v = Math.max(0, Math.min(255, (p[i]-70)*1.9)); p[i] = p[i+1] = p[i+2] = v; }
  x.putImageData(d, 0, 0); return c;
}
function numPE(s){
  s = String(s).replace(/[Oo]/g,"0").replace(/[lI]/g,"1");
  s = /,\d{2}$/.test(s) && !/\.\d{2}$/.test(s) ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  return toNum(s);
}
const UNI_RX = /^(UND|UNI|UN|U|CAJA|CJA|CJ|POTE|POT|PQT|PAQ|BOL|BOLSA|DOC|TIRA|PACK|PK|KG|LT|GLN|GAL|FARDO|DISP|SAC|SACO)$/;
const nombreBonito = s => s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
// Convierte el texto leído en el mismo formato que usa el formulario de revisión
function interpretar(texto){
  const r = {proveedor:"", ruc:"", documento:"", fecha:"", total:0, condicion:"", dias_credito:0, items:[], dudas:[]};
  const lineas = texto.split(/\n/).map(l => l.replace(/[|_]/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  for(const l of lineas){
    if(!r.proveedor && /S\.?\s?A\.?\s?C\b|E\.?I\.?R\.?L|S\.A\./i.test(l)) r.proveedor = l.replace(/\s*R\.?U\.?C.*$/i,"").trim();
    if(!r.documento){ const m = l.match(/\b([A-Z]{1,2}[0-9O]{2,3})\s?-\s?([0-9O]{6,8})\b/); if(m) r.documento = m[1].replace(/O/g,"0")+"-"+m[2].replace(/O/g,"0"); }
    if(!r.fecha){ const m = l.match(/\b(\d{2})[\/\-.](\d{2})[\/\-.](\d{4})\b/); if(m) r.fecha = `${m[3]}-${m[2]}-${m[1]}`; }
    if(!r.ruc){ const m = l.match(/\b(10|20)\d{9}\b/); if(m) r.ruc = m[0]; }
    if(/CR[EÉ]DITO/i.test(l)){ r.condicion = "credito"; const m = l.match(/(\d{1,3})\s*D[IÍ]AS/i); if(m) r.dias_credito = +m[1]; }
    else if(!r.condicion && /CONTADO/i.test(l)) r.condicion = "contado";
    if(/TOTAL|PAGAR/i.test(l)){ const ns = l.match(/\d[\d.,]*[.,]\d{2}\b/g); if(ns){ const v = numPE(ns[ns.length-1]); if(v > r.total) r.total = v; } }
    const m = l.match(/^(\d{5,7})\s+(.*)$/);
    if(!m) continue;
    const tok = m[2].split(" "), nums = [];
    // Formato "código cantidad unidad descripción precio importe" (ej. Dixon)
    let cantIni = null, uniIni = null;
    if(/^[\d.,]+$/.test(tok[0] || "") && UNI_RX.test((tok[1] || "").toUpperCase())){ cantIni = tok.shift(); uniIni = tok.shift().toUpperCase(); }
    while(tok.length && /^[\d.,O]+$/.test(tok[tok.length-1]) && nums.length < (cantIni ? 2 : 3)) nums.unshift(tok.pop());
    if(cantIni){ nums.unshift(cantIni); if(nums.length === 3) tok.push(uniIni); }
    if(nums.length < 2){ r.dudas.push(`no pude leer los números de "${l.slice(0,40)}"`); continue; }
    let unidad = "UN"; if(tok.length && UNI_RX.test(tok[tok.length-1].toUpperCase())) unidad = tok.pop().toUpperCase();
    unidad = unidad.replace(/^(CJ|CJA)$/,"CAJA").replace(/^(UNI|U)$/,"UN").replace(/^POT$/,"POTE").replace(/^SAC$/,"SACO");
    const desc = tok.join(" ");
    let cant, pu, imp;
    if(nums.length === 3) [cant, pu, imp] = nums.map(numPE); else { cant = numPE(nums[0]); imp = numPE(nums[1]); pu = cant ? imp/cant : 0; }
    const bon = imp === 0 || /GRAT|BONIF|OBSEQ/i.test(desc);
    if(!bon && Math.abs(cant*pu - imp) > Math.max(0.1, imp*0.03)) r.dudas.push(`${desc.slice(0,28)}: ${num(cant,2)} × ${num(pu,2)} no da ${num(imp,2)}`);
    const f = desc.match(/(\d+)\s?[*xX×]\s?[\d.,]+\s?U/) || desc.match(/(\d+)\s?U\b/i);
    const factor = ["CAJA","POTE","PAQ","PQT","PACK","FARDO","DISP"].includes(unidad) && f ? +f[1] : 1;
    r.items.push({codigo:m[1], descripcion:desc, cantidad:cant, unidadCompra:unidad, precioUnit:pu, importe:imp, bonificacion:bon, productoKey:"", factor, nuevo:{nombre:nombreBonito(desc)}});
  }
  if(r.total && r.items.length){ const s = r.items.reduce((a,i) => a+i.importe, 0); if(Math.abs(s - r.total) > 0.05) r.dudas.unshift(`los importes suman ${soles(s)} y el total dice ${soles(r.total)}`); }
  return r;
}

  if(r.proveedor && !d.pedidoId) d.proveedor = (S.proveedores.find(p => parecido(p.nombre, r.proveedor) >= 0.6)?.nombre) || r.proveedor;
  d.ruc = r.ruc || d.ruc || "";
  if(/^\d{4}-\d{2}-\d{2}$/.test(r.fecha || "")) d.fecha = r.fecha;
  d.documento = r.documento || d.documento; d.total = toNum(r.total) || d.total;
  if(r.condicion === "credito"){ d.condicion = "credito"; if(toNum(r.dias_credito) > 0) d.dias = toNum(r.dias_credito); }
  else if(r.condicion === "contado") d.condicion = "contado";
  d.dudas = Array.isArray(r.dudas) ? r.dudas.slice(0,6) : [];
  if(!(r.items || []).length) return;
  const filas = d.filas.filter(f => f.desdePedido);
  filas.forEach(f => f.llenada = false);
  for(const it of r.items){
    const desc = String(it.descripcion || "").trim();
    const ex = porCodigoProv(d.proveedor, it.codigo) || porAlias(desc) || porAliasParecido(desc);
    const nombre = ex?.nombre || porNombre(it.nombre || "")?.nombre || it.nombre || it.nuevo?.nombre || nombreBonito(desc);
    const uc = String(it.unidadCompra || "UN").toUpperCase().trim().replace(/^SAC$/,"SACO").replace(/^CJ$/,"CAJA").replace(/^UND$/,"UN");
    const datos = {nombre, marca: it.marca || "", linea: it.linea || "", unidad:uc, factor: ex?.presentaciones?.[uc] || toNum(it.factor) || 1, cantidad: toNum(it.cantidad) || 1, precioUnit: toNum(it.precioUnit), importe: toNum(it.importe), bonificacion: !!it.bonificacion, descripcion: desc, codigoProv: it.codigo || "", importeManual: true};
    const delPedido = filas.find(f => !f.llenada && norm(f.nombre) === norm(nombre));
    if(delPedido) Object.assign(delPedido, datos, {llenada:true}); else filas.push({...filaVacia(), ...datos});
  }
  filas.filter(f => f.desdePedido && !f.llenada).forEach(f => { f.cantidad = 0; f.importe = 0; f.observacion = "faltó"; });
  d.filas = filas.length ? filas : [filaVacia()];
}

async function guardarRecepcion(btn){
  const d = S.rec, filas = d.filas.filter(f => f.nombre.trim());
  if(!filas.length){ toast("Agrega al menos un producto."); return; }
  if(filas.some(f => toNum(f.cantidad) < 0 || !(toNum(f.factor) > 0))){ toast("Revisa las cantidades y el campo Trae."); return; }
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Guardando…`;
  try{
    let pr = d.proveedor.trim() ? S.proveedores.find(p => norm(p.nombre) === norm(d.proveedor)) : null;
    if(!pr && d.proveedor.trim()) [pr] = await insertar("proveedores", {nombre:d.proveedor.trim(), ruc:d.ruc || null, dias_credito: d.condicion === "credito" ? toNum(d.dias) : 0});
    else if(pr && d.condicion === "credito" && toNum(d.dias) && toNum(d.dias) !== pr.dias_credito) await actualizar("proveedores", pr.id, {dias_credito: toNum(d.dias)});
    // Las filas con el mismo nombre son un solo producto
    const grupos = new Map();
    filas.forEach(f => { const k = norm(f.nombre); if(!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(f); });
    const items = [];
    for(const fs of grupos.values()){
      const pres = {}; fs.forEach(f => pres[String(f.unidad || "UN").toUpperCase()] = toNum(f.factor));
      const alias = [...new Set([...fs.map(f => norm(f.descripcion)), ...fs.map(f => f.codigoProv ? claveCod(d.proveedor, f.codigoProv) : "")].filter(Boolean))];
      let p = porNombre(fs[0].nombre);
      if(!p) [p] = await insertar("productos", {nombre: fs[0].nombre.trim(), marca: fs[0].marca || null, linea: fs[0].linea || null, presentaciones: pres, alias});
      else await actualizar("productos", p.id, {presentaciones: {...(p.presentaciones || {}), ...pres}, alias: [...new Set([...(p.alias || []), ...alias])]});
      fs.forEach(f => { const c = toNum(f.cantidad); if(c > 0 || f.observacion) items.push({producto_id:p.id, descripcion:f.descripcion || null, cantidad:c,
        unidad_compra:String(f.unidad || "UN").toUpperCase(), factor:toNum(f.factor), unidades:c*toNum(f.factor), precio_unit:toNum(f.precioUnit),
        importe: f.bonificacion ? 0 : toNum(f.importe), bonificacion: !!f.bonificacion, observacion: f.observacion || null}); });
    }
    const total = d.pedidoId ? items.reduce((a,i) => a+i.importe, 0) : (toNum(d.total) || items.reduce((a,i) => a+i.importe, 0));
    const [rec] = await insertar("recepciones", {pedido_id:d.pedidoId, proveedor_id:pr?.id || null, fecha:d.fecha || hoy(), documento:d.documento.trim() || null, total, condicion:d.condicion, dias_credito: d.condicion === "credito" ? toNum(d.dias) : null, vence: d.condicion === "credito" ? sumarDias(d.fecha || hoy(), toNum(d.dias)) : null, origen: d.leida ? "foto" : "manual"});
    if(items.length) await insertar("recepcion_items", items.map(i => ({...i, recepcion_id:rec.id})));
    if(d.pedidoId){ await cargar(); const pe = S.pedidos.find(p => p.id === d.pedidoId); if(pe){ const a = avancePedido(pe); await actualizar("pedidos", pe.id, {estado: a.lineas.every(l => l.pendiente <= 0) ? "recibido" : "cerrado"}); } }
    S.rec = null; await refrescar(true); ir("inicio");
    toast(`Mercadería guardada: ${grupos.size} producto${grupos.size===1?"":"s"}.${d.condicion==="credito" ? " Crédito anotado." : ""}`);
  }catch(e){ btn.disabled = false; btn.textContent = "Guardar en el inventario"; toast("No se pudo guardar: " + (e.message || "revisa tu conexión")); }
}

function margenHtml(precio, costo){
  if(!(precio > 0)) return `<span class="muted small">pon precio</span>`;

  const m = margenSobreCosto(precio, costo), cls = m < 0 ? "bad" : m < 0.15 ? "warn" : "ok";

// ---------- Eventos ----------
document.addEventListener("click", async e => {
  if(!e.target.closest("#sug") && !e.target.matches?.("[data-k=nombre]")) $("#sug")?.remove();
  const t = e.target.closest("[data-go],[data-act]"); if(!t) return;
  if(t.dataset.go){ if(t.dataset.go === "recibir" && S.view !== "recibir") S.rec = S.rec || null; ir(t.dataset.go); return; }
  const a = t.dataset.act, id = t.dataset.id;
  try{
    if(a === "cerrar-fondo"){ if(e.target === t) cerrarFicha(); }
    else if(a === "abrir"){ S.abierto = id; renderFicha(); }
    else if(a === "cerrar") cerrarFicha();
    else if(a === "wa-resumen") abrirEnvioWA();
    else if(a === "wa-enviar"){ abrirWhatsApp($("#wa-texto").value); cerrarFicha(); }
    else if(a === "wa-creditos"){ const L = ["*Créditos por pagar*"]; S.recepciones.filter(r => r.condicion === "credito" && !r.pagado).sort((x,y) => (x.vence||"").localeCompare(y.vence||"")).forEach(r => L.push(`• ${prov(r.proveedor_id)?.nombre || "Proveedor"} ${soles(r.total)} – ${estadoCredito(r).txt}`)); abrirWhatsApp(L.join("\n")); }
    else if(a === "guardar-wa"){ let n = $("#wa-num").value.replace(/D/g,""); if(n.length === 9) n = "51" + n; await api("config_tienda", {method:"POST", body:{id:1, whatsapp:n || null}, prefer:"resolution=merge-duplicates"}); S.config = {...S.config, whatsapp:n}; render(); toast(n ? "Número guardado: los avisos irán a +" + n : "Número borrado."); }
    else if(a === "salir"){ salir(); }
    // Vender
    else if(a === "sel-venta"){ S.venta.sel = id || null; const p = prod(id); S.venta.cant = 1; S.venta.precio = p?.precio_venta ?? ""; render(); if(id) setTimeout(() => $("#panelVenta")?.scrollIntoView({behavior:"smooth", block:"center"}), 30); }
    else if(a === "cant"){ S.venta.cant = Math.max(0, toNum(S.venta.cant) + toNum(t.dataset.d)); render(); }
    else if(a === "registrar-venta"){
      const p = prod(S.venta.sel), cant = toNum(S.venta.cant), precio = toNum(S.venta.precio);
      if(!(cant > 0)){ toast("Pon una cantidad mayor que 0."); return; }
      t.disabled = true;
      await insertar("ventas", {producto_id:p.id, cantidad:cant, precio_unit: precio || null, total: Math.round(cant*precio*100)/100});
      if(precio && precio !== toNum(p.precio_venta)) await actualizar("productos", p.id, {precio_venta:precio});
      S.venta = {q:S.venta.q, sel:null, cant:1, precio:""}; await refrescar(true); toast(`Venta registrada: ${num(cant,2)} ${plural(uv(p),cant)} de ${p.nombre}.`);
    }
    else if(a === "anular-venta"){ if(t.dataset.ok !== "1"){ t.dataset.ok = "1"; t.textContent = "¿Seguro?"; return; } await borrar("ventas", id); await refrescar(true); toast("Venta anulada."); }
    // Pedidos
    else if(a === "nuevo-pedido"){ S.pedido = nuevoPedidoVacio(); S.pedido.modo = "manual"; ir("pedidos"); }
    else if(a === "add-pl"){ S.pedido.lineas.push(lineaPedido()); render(); }
    else if(a === "del-pl"){ S.pedido.lineas.splice(+t.dataset.i, 1); if(!S.pedido.lineas.length) S.pedido.lineas.push(lineaPedido()); render(); }
    else if(a === "cancelar-pedido-form"){ S.pedido = null; render(); }
    else if(a === "guardar-pedido") await guardarPedido(t);
    else if(a === "cerrar-pedido"){ if(t.dataset.ok !== "1"){ t.dataset.ok = "1"; t.textContent = "Confirmar"; return; } await actualizar("pedidos", id, {estado:"cerrado"}); await refrescar(true); toast("Pedido cerrado."); }
    else if(a === "recibir-pedido"){ nuevaRecepcion(id); S.rec.modo = t.dataset.modo || "completo"; render(); if(S.rec.modo === "completo") abrirConfirmacion(); }
    // Recibir
    else if(a === "recibir-directo") nuevaRecepcion(null);
    else if(a === "subir-boleta"){ if(!S.pedido) S.pedido = nuevoPedidoVacio(); ir("pedidos"); }
    else if(a === "leer-pedido") leerBoletaPedido();
    else if(a === "instalar") instalarApp();
    else if(a === "excel-venta" || a === "excel-ganancia"){ await descargarExcel(a === "excel-venta" ? "kardex-precios" : "kardex-ganancia", {"Precios y ganancia": filasVenta()}); toast("Excel descargado."); }
    else if(a === "guardar-precios"){ const cam = Object.entries(S.pvCambios || {}); if(!cam.length){ toast("No hay cambios por guardar."); return; } t.disabled = true; for(const [pid, ch] of cam) await actualizar("productos", pid, ch); S.pvCambios = {}; await refrescar(true); toast(`Precios guardados: ${cam.length} producto${cam.length===1?"":"s"}.`); }
    else if(a === "sug"){ const l = S.pedido.lineas[+t.dataset.i], p = prod(id); if(l && p){ elegirProductoLinea(l, p); $("#sug")?.remove(); render(); } }
    else if(a === "abrir-selector"){ S.sel = {q:"", linea:"", marca:"", ids:new Set()}; abrirSelector(); }
    else if(a === "sel-agregar"){ const nuevas = [...S.sel.ids].map(pid => { const l = lineaPedido(); l.cantidad = 1; elegirProductoLinea(l, prod(pid)); return l; }); S.pedido.lineas = [...S.pedido.lineas.filter(l => l.nombre.trim()), ...nuevas]; if(!S.pedido.lineas.length) S.pedido.lineas.push(lineaPedido()); cerrarFicha(); render(); toast(`Agregados ${nuevas.length} productos. Pon las cantidades.`); }
    else if(a === "descartar-pedido"){ if(!await confirmar(t, "¿Descartar todo? Tocar otra vez")) return; S.pedido = null; render(); toast("Pedido descartado. No se guardó nada."); }
    else if(a === "modo-pedido"){ S.pedido.modo = t.dataset.v; render(); if(t.dataset.v === "foto" && !S.pedido.url) setTimeout(() => $("#foto-pedido")?.click(), 80); }
    else if(a === "filtro-hist"){ S.fh = t.dataset.v; render(); }
    else if(a === "excel-stock"){ await descargarExcel("kardex-stock", {"Stock": filasStock()}); toast("Excel descargado."); }
    else if(a === "excel-compras"){ await descargarExcel("kardex-compras", {"Compras": filasCompras()}); toast("Excel descargado."); }
    else if(a === "excel-pedidos"){ await descargarExcel("kardex-pedidos", {"Pedidos": filasPedidos()}); toast("Excel descargado."); }
    else if(a === "excel-todo"){ await descargarExcel("kardex-completo", {"Stock": filasStock(), "Compras": filasCompras(), "Pedidos": filasPedidos()}); toast("Excel descargado."); }
    else if(a === "guardar-minimos"){ const ins = [...document.querySelectorAll("[data-min]")].filter(i => i.value.trim() !== ""); if(!ins.length){ toast("Escribe al menos un mínimo."); return; } t.disabled = true; for(const i of ins) await actualizar("productos", i.dataset.min, {stock_minimo: toNum(i.value)}); await refrescar(true); toast(`Mínimos guardados: ${ins.length}.`); }
    else if(a === "cond-pedido"){ S.pedido.condicion = t.dataset.v; render(); }
    else if(a === "zoom-pedido") abrirZoom(S.pedido.url);
    else if(a === "girar-pedido"){ S.pedido.img = await girarImagen(S.pedido.img); S.pedido.url = S.pedido.img.src; render(); }
    else if(a === "descartar-rec"){ S.rec = null; render(); }
    else if(a === "leer") leerBoleta();
    else if(a === "cond"){ S.rec.condicion = t.dataset.v; render(); }
    else if(a === "add-fila"){ S.rec.filas.push(filaVacia()); render(); $(`[data-f="${S.rec.filas.length-1}"][data-k="nombre"]`)?.focus(); }
    else if(a === "del-fila"){ S.rec.filas.splice(+t.dataset.i, 1); if(!S.rec.filas.length) S.rec.filas.push(filaVacia()); render(); }
    else if(a === "usar-nombre"){ e.preventDefault(); const f = S.rec.filas[+t.dataset.i]; f.nombre = t.dataset.n; const p = porNombre(f.nombre); if(p?.presentaciones?.[f.unidad]) f.factor = p.presentaciones[f.unidad]; render(); }
    else if(a === "guardar-rec") abrirConfirmacion();
    else if(a === "confirmar-rec"){ await guardarRecepcion(t); if(!S.rec) $("#overlayRoot").innerHTML = ""; }
    else if(a === "zoom") abrirZoom();
    else if(a === "cerrar-zoom"){ if(e.target === t || t.tagName === "BUTTON") $("#overlayRoot").innerHTML = ""; }
    else if(a === "zoom-mas" || a === "zoom-menos"){ S.zoomW = Math.max(100, Math.min(400, (S.zoomW || 100) + (a === "zoom-mas" ? 50 : -50))); $("#zoomImg").style.width = S.zoomW + "%"; }
    else if(a === "girar"){ S.rec.img = await girarImagen(S.rec.img); S.rec.url = S.rec.img.src; render(); }
    // Borrar pruebas
    else if(a === "borrar-rec"){ e.preventDefault(); if(!await confirmar(t, "¿Borrar boleta, su pedido y su stock? Tocar otra vez")) return; t.disabled = true; await borrarRecepciones(S.recepciones.filter(r => r.id === id)); await limpiarHuerfanos(); await refrescar(true); toast("Boleta borrada de todo: historial, pedido y stock."); }
    else if(a === "borrar-pedido"){ if(!await confirmar(t, "¿Borrar pedido y lo recibido? Tocar otra vez")) return; t.disabled = true;
      await api(`recepciones?pedido_id=eq.${id}`, {method:"DELETE"}); await borrar("pedidos", id); await limpiarHuerfanos(); await refrescar(true); toast("Pedido borrado."); }
    else if(a === "borrar-dia"){ if(!await confirmar(t, "¿Borrar todo el día? Tocar otra vez")) return; t.disabled = true; await borrarRecepciones(S.recepciones.filter(r => r.fecha === t.dataset.f)); await limpiarHuerfanos(); await refrescar(true); toast(`Se borró todo lo del ${fecha(t.dataset.f)}: boletas, pedidos y stock.`); }
    else if(a === "borrar-fecha"){
      const f = $("#del-fecha").value; if(!f){ toast("Elige una fecha."); return; }
      if(!await confirmar(t, `¿Borrar todo lo del ${fecha(f)}? Tocar otra vez`)) return; t.disabled = true;
      const [ini, fin] = rangoDia(f);
      await api(`ventas?creado=gte.${ini}&creado=lt.${fin}`, {method:"DELETE"});
      await api(`ajustes?creado=gte.${ini}&creado=lt.${fin}`, {method:"DELETE"});
      await borrarRecepciones(S.recepciones.filter(r => r.fecha === f));
      await api(`pedidos?fecha=eq.${f}`, {method:"DELETE"});
      await limpiarHuerfanos(); await refrescar(true); toast(`Se borró todo lo del ${fecha(f)}.`);
    }
    else if(a === "borrar-todo"){
      if(!await confirmar(t, "¿Seguro? Se borra TODO. Tocar otra vez")) return; t.disabled = true;
      for(const tabla of ["ventas","ajustes","recepciones","pedidos","productos","proveedores"]) await api(`${tabla}?id=not.is.null`, {method:"DELETE"});
      S.rec = null; S.pedido = null; await refrescar(true); toast("Listo: la tienda quedó vacía.");
    }
    // Ficha, créditos, proveedores
    else if(a === "guardar-conteo"){
      const p = prod(S.abierto), v = $("#conteo").value.trim(); if(v === ""){ toast("Escribe la cantidad que contaste."); return; }
      const dif = Math.round((toNum(v) - (S.stock.get(p.id) ?? 0))*100)/100;
      if(dif === 0){ toast("Coincide con el sistema."); return; }
      await insertar("ajustes", {producto_id:p.id, cantidad:dif, motivo:$("#motivo").value}); await refrescar(true); renderFicha(); toast(`Stock corregido (${dif > 0 ? "+" : ""}${num(dif,2)}).`);
    }
    else if(a === "guardar-producto"){
      const p = prod(S.abierto), val = k => $("#"+k).value.trim(), nombre = val("e-nombre");
      if(!nombre){ toast("El nombre no puede quedar vacío."); return; }
      const dup = porNombre(nombre); if(dup && dup.id !== p.id){ toast(`Ya existe "${dup.nombre}".`); return; }
      await actualizar("productos", p.id, {nombre, marca:val("e-marca") || null, linea:val("e-linea") || null, unidad_venta:val("e-unidad"), precio_venta: val("e-pv") === "" ? null : toNum(val("e-pv")), stock_minimo: toNum(val("e-min"))});
      await refrescar(true); renderFicha(); toast("Producto actualizado.");
    }
    else if(a === "pagar"){ if(t.dataset.ok !== "1"){ t.dataset.ok = "1"; t.textContent = "Confirmar pago"; return; } await actualizar("recepciones", id, {pagado:true, fecha_pago:hoy()}); await refrescar(true); toast("Crédito marcado como pagado."); }
    else if(a === "guardar-prov"){
      const cambios = {}; document.querySelectorAll(`[data-pv="${id}"]`).forEach(i => cambios[i.dataset.k] = i.dataset.k === "dias_credito" ? Math.round(toNum(i.value)) : (i.value.trim() || null));
      if(!cambios.nombre){ toast("El nombre no puede quedar vacío."); return; }
      await actualizar("proveedores", id, cambios); await refrescar(true); toast("Proveedor guardado.");
    }
  }catch(err){ t.disabled = false; toast("No se pudo completar: " + (err.message || "revisa tu conexión")); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.abierto) cerrarFicha();
  if((e.key === "Enter" || e.key === " ") && e.target.matches?.("tr[data-act='abrir']")){ e.preventDefault(); S.abierto = e.target.dataset.id; renderFicha(); }
});
document.addEventListener("submit", async e => {
  if(e.target.id !== "formLogin") return; e.preventDefault();
  const clave = $("#clave").value.trim(); const msg = $("#loginMsg");
  if(!clave){ msg.textContent = "Escribe la clave."; return; }
  msg.textContent = "Comprobando…";
  try{
    const r = await fetch(`${SB_URL}/rest/v1/rpc/clave_ok`, {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json", "x-clave-tienda":clave}, body:"{}"});
    if(r.ok && (await r.json()) === true){ S.clave = clave; LS.set("kardex-clave", clave); render(); await refrescar(true); }
    else msg.textContent = "Esa clave no es correcta.";
  }catch{ msg.textContent = "Sin conexión. Revisa el internet e intenta de nuevo."; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "f-q"){ S.f.q = t.value; const pos = t.selectionStart; render(); const n = $("#f-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.id === "v-q"){ S.venta.q = t.value; $("#tiles").innerHTML = tilesVenta(); return; }
  if(t.id === "v-cant" || t.id === "v-precio"){ S.venta[t.id === "v-cant" ? "cant" : "precio"] = t.value; $("#v-total").textContent = soles(toNum(S.venta.cant)*toNum(S.venta.precio)); return; }
  if(t.dataset.f !== undefined && S.rec){
    const i = +t.dataset.f, f = S.rec.filas[i], k = t.dataset.k; if(!f || t.type === "checkbox" || t.tagName === "SELECT") return;
    f[k] = t.value;
    const imp = $(`[data-f="${i}"][data-k="importe"]`);
    if(k === "importe"){ f.importeManual = t.value.trim() !== ""; if(t.value.trim() !== "" && toNum(t.value) === 0 && toNum(f.cantidad) > 0){ f.bonificacion = true; const cb = $(`[data-f="${i}"][data-k="bonificacion"]`); if(cb) cb.checked = true; } }
    if((k === "cantidad" || k === "precioUnit") && !f.importeManual && !f.bonificacion){ f.importe = Math.round(toNum(f.cantidad)*toNum(f.precioUnit)*100)/100 || ""; if(imp) imp.value = f.importe; }
    actualizarFila(i); return;
  }
  if(t.dataset.pvK){ const v = t.dataset.pvK === "bonif_venta" ? t.value.trim() || null : (t.value.trim() === "" ? null : toNum(t.value)); ((S.pvCambios ??= {})[t.dataset.id] ??= {})[t.dataset.pvK] = v; const p = prod(t.dataset.id); if(p){ const q = {...p, ...S.pvCambios[t.dataset.id]}; const el = $(`#pvm-${p.id}`); if(el) el.innerHTML = margenHtml(precioFinal(q), calc(p).costo); } return; }
  if(t.id === "fv-q"){ S.fv.q = t.value; const pos = t.selectionStart; render(); const n = $("#fv-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  const cuadreP = () => { const c = $("#cuadre-pedido"); if(c) c.textContent = cuadrePedidoTxt(); };
  if(t.dataset.pf){ S.pedido[t.dataset.pf] = t.value; cuadreP(); return; }
  if(t.id === "sel-q"){ S.sel.q = t.value; const pos = t.selectionStart; abrirSelector(); const n = $("#sel-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.dataset.pl !== undefined){ if(t.type === "checkbox") return; S.pedido.lineas[+t.dataset.pl][t.dataset.k] = t.value; cuadreP(); if(t.dataset.k === "nombre") mostrarSugerencias(t); if(t.dataset.k === "nombre"){ const p = porNombre(t.value); if(p){ const big = Object.entries(p.presentaciones||{}).sort((a,b) => b[1]-a[1])[0]; if(big){ S.pedido.lineas[+t.dataset.pl].unidad = big[0]; S.pedido.lineas[+t.dataset.pl].factor = big[1]; } } } return; }
  const d = S.rec; if(!d) return;
  if(t.dataset.h){ d[t.dataset.h] = t.value; if(t.dataset.h === "total") $("#cuadre").innerHTML = cuadreHtml(); return; }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if(t.dataset.pvK && t.tagName === "SELECT"){ ((S.pvCambios ??= {})[t.dataset.id] ??= {})[t.dataset.pvK] = t.value; return; }
  if(t.id === "fv-linea" || t.id === "fv-marca"){ S.fv[t.id.slice(3)] = t.value; render(); return; }
  if(t.dataset.sel){ t.checked ? S.sel.ids.add(t.dataset.sel) : S.sel.ids.delete(t.dataset.sel); const b = $("[data-act=sel-agregar]"); if(b) b.textContent = `Agregar al pedido (${S.sel.ids.size})`; return; }
  if(t.id === "sel-linea" || t.id === "sel-marca"){ S.sel[t.id.slice(4)] = t.value; abrirSelector(); return; }
  if(t.dataset.waSec){ t.checked ? S.wa.sec.add(t.dataset.waSec) : S.wa.sec.delete(t.dataset.waSec); $("#wa-texto").value = mensajeElegido(S.wa); return; }
  if(t.dataset.waF){ S.wa[t.dataset.waF] = t.value; $("#wa-texto").value = mensajeElegido(S.wa); return; }
  if(["f-linea","f-marca","f-prov"].includes(t.id)){ S.f[t.id.slice(2)] = t.value; render(); return; }
  if(t.dataset.pl !== undefined && t.dataset.k === "nombre"){ render(); return; }
  if(t.dataset.pl !== undefined && ["cantidad","factor","unidad","unidadVenta"].includes(t.dataset.k)){ S.pedido.lineas[+t.dataset.pl][t.dataset.k] = t.value; render(); return; }
  if(t.dataset.pl !== undefined && t.dataset.k === "bonif"){ S.pedido.lineas[+t.dataset.pl].bonif = t.checked; render(); return; }
  if(t.id === "foto-pedido" && t.files?.[0]){
    try{ const {im, url} = await cargarImagen(t.files[0]); Object.assign(S.pedido, {img:im, url, error:"", leida:false}); render(); leerBoletaPedido(); }
    catch{ S.pedido.error = "No pude abrir esa imagen. Prueba con otra foto."; render(); }
    return;
  }
  if(t.dataset.pf === "proveedor") return;
  if(t.id === "foto" && t.files?.[0]){
    try{ const {im, url} = await cargarImagen(t.files[0]); Object.assign(S.rec, {img:im, url, error:"", leida:false}); render(); }
    catch{ S.rec.error = "No pude abrir esa imagen. Prueba con otra foto."; render(); }
    return;
  }
  if(t.dataset.f === undefined || !S.rec) return;
  const i = +t.dataset.f, f = S.rec.filas[i], k = t.dataset.k; if(!f) return;
  const imp = $(`[data-f="${i}"][data-k="importe"]`);
  if(k === "llego"){
    f.noLlego = !t.checked;
    if(f.noLlego){ f.guardado = {cantidad:f.cantidad, importe:f.importe}; f.cantidad = 0; f.importe = 0; f.observacion = "faltó"; }
    else { Object.assign(f, f.guardado || {}); if(f.observacion === "faltó") f.observacion = ""; }
    render();
  }
  else if(k === "bonificacion"){ f.bonificacion = t.checked; if(t.checked) f.importe = 0; else { f.importeManual = false; f.importe = Math.round(toNum(f.cantidad)*toNum(f.precioUnit)*100)/100 || ""; } if(imp) imp.value = f.importe; actualizarFila(i); }
  else if(k === "observacion") f.observacion = t.value;
  else if(k === "unidad"){ f.unidad = t.value; const p = porNombre(f.nombre), fac = p?.presentaciones?.[t.value]; if(fac) f.factor = fac; else if(t.value === "UN") f.factor = 1; render(); }
  else if(k === "nombre"){ const p = porNombre(f.nombre); if(p){ f.nombre = p.nombre; const fac = p.presentaciones?.[f.unidad]; if(fac) f.factor = fac; } render(); }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" || !e.target.matches?.("table.boleta input")) return;
  e.preventDefault();
  const i = +e.target.dataset.f;
  if(i === S.rec.filas.length - 1){ S.rec.filas.push(filaVacia()); render(); }
  $(`[data-f="${i+1}"][data-k="nombre"]`)?.focus();
});

async function guardarPedido(btn){
  const d = S.pedido, lineas = d.lineas.filter(l => l.nombre.trim() && toNum(l.cantidad) > 0);
  if(!lineas.length){ toast("Agrega al menos un producto."); return; }
  // La misma boleta del mismo proveedor no se registra dos veces sin querer
  const doc = norm(d.documento || "");
  const repetido = doc && S.pedidos.find(pe => norm(pe.documento || "") === doc && norm(prov(pe.proveedor_id)?.nombre || "") === norm(d.proveedor));
  if(repetido && btn.dataset.ok !== "1"){ btn.dataset.ok = "1"; btn.textContent = "Ya existe: tocar otra vez para guardarla igual"; toast(`La boleta ${d.documento} de ${d.proveedor} ya está registrada (pedido del ${fecha(repetido.fecha)}).`); return; }
  btn.disabled = true;
  let pr = d.proveedor.trim() ? S.proveedores.find(p => norm(p.nombre) === norm(d.proveedor)) : null;
  if(!pr && d.proveedor.trim()) [pr] = await insertar("proveedores", {nombre:d.proveedor.trim()});
  const items = [];
  for(const l of lineas){
    let p = porNombre(l.nombre);
    const uc = String(l.unidad||"UN").toUpperCase().trim(), presL = {[uc]: toNum(l.factor) || 1, ...(l.empaque ? {[l.empaque.unidad]: l.empaque.factor} : {})}, alias = [l.descripcion ? norm(l.descripcion) : "", l.codigoProv ? claveCod(d.proveedor, l.codigoProv) : ""].filter(Boolean);
    if(!p){ [p] = await insertar("productos", {nombre:l.nombre.trim(), marca: l.marca || null, linea: l.linea || null, unidad_venta: l.unidadVenta || "unidad", presentaciones:presL, alias}); S.productos.push(p); }
    else {
      // Recordar cómo lo escribe este proveedor (descripción y su código) para reconocerlo la próxima vez
      const nuevos = alias.filter(a => !(p.alias||[]).includes(a)), cambios = {};
      if(l.empaque && !(p.presentaciones||{})[l.empaque.unidad]) cambios.presentaciones = {...(p.presentaciones||{}), ...presL};
      if(nuevos.length){ cambios.alias = [...(p.alias||[]), ...nuevos]; cambios.presentaciones = {...(p.presentaciones||{}), ...presL}; }
      if(!p.marca && l.marca) cambios.marca = l.marca;
      if(!p.linea && l.linea) cambios.linea = l.linea;
      if(Object.keys(cambios).length){ await actualizar("productos", p.id, cambios); Object.assign(p, cambios); }
    }
    items.push({producto_id:p.id, cantidad:toNum(l.cantidad), unidad_compra:uc, factor:toNum(l.factor) || 1, precio_unit: toNum(l.precio) || null, bonificacion: !!l.bonif, descripcion: l.descripcion || null});
  }
  const [pe] = await insertar("pedidos", {proveedor_id:pr?.id || null, entrega:d.entrega || null, documento: (d.documento || "").trim() || null, total: toNum(d.total) || items.reduce((a,i) => a + (i.bonificacion ? 0 : i.cantidad*toNum(i.precio_unit)), 0), condicion: d.condicion === "credito" ? "credito" : "contado", dias_credito: d.condicion === "credito" ? toNum(d.dias) || 15 : null});
  await insertar("pedido_items", items.map(i => ({...i, pedido_id:pe.id})));
  S.pedido = null; await refrescar(true); toast("Pedido guardado. Cuando llegue, tócalo para recibirlo.");
}
function salir(){ LS.del("kardex-clave"); S.clave = null; S.conectado = false; render(); }

// ---------- Inicio ----------
render();
if(S.clave) refrescar(true);
setInterval(() => { if(document.visibilityState === "visible" && S.clave) refrescar(false); }, 15000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S.clave) refrescar(false); });
</script>
